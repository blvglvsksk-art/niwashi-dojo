{hot:1,cat:"造園史・様式",ex:ALL,t:"tf",q:"龍安寺の石庭は、池のまわりを歩いて眺める池泉回遊式庭園の代表である。",a:false,e:"龍安寺の石庭は、水を使わない枯山水の代表。"},
{hot:1,cat:"造園史・様式",ex:G,t:"tf",q:"桂離宮の庭園は、室町時代に造られた枯山水の庭である。",a:false,e:"桂離宮は江戸初期の回遊式庭園。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"極楽浄土を表した浄土式庭園の代表例は、龍安寺である。",a:false,e:"浄土式庭園の代表は平等院や毛越寺。"},
{cat:"造園史・様式",ex:GS,t:"tf",q:"『作庭記』は、江戸時代に書かれた作庭書である。",a:false,e:"『作庭記』は平安時代の作庭書で、日本最古とされる。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"夢窓疎石は、千利休に茶の湯を学んだ安土桃山時代の作庭家である。",a:false,e:"夢窓疎石は鎌倉末〜南北朝期の禅僧。利休より200年以上前の人。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"京都の円通寺の庭は、富士山を借景としていることで知られる。",a:false,e:"円通寺の借景は比叡山。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"偕楽園は、加賀藩の前田家が造った庭園である。",a:false,e:"偕楽園は水戸藩の徳川斉昭。前田家が関わったのは兼六園。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"六義園は、徳川家康が造った大名庭園である。",a:false,e:"六義園は柳沢吉保が造った。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"フランス平面幾何学式庭園の代表は、ヴィラ・デステである。",a:false,e:"フランス式の代表はヴェルサイユ宮殿の庭園。ヴィラ・デステはイタリアの露壇式。"},
{cat:"造園史・様式",ex:GS,t:"tf",q:"日比谷公園は、昭和の戦後に開園した公園である。",a:false,e:"日比谷公園は明治36年（1903年）開園。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"露地とは、大名が舟遊びをするための大きな池のある庭のことである。",a:false,e:"露地は茶室へ向かう通路としての庭（茶庭）。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"胴吹き枝は、樹形をつくる大切な枝なので残しておく。",a:false,e:"胴吹き枝は忌み枝の一つで、一般に取り除く。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"ひこばえとは、主幹のてっぺんから勢いよく伸びる枝のことである。",a:false,e:"ひこばえは根元から出る若い枝。てっぺんから勢いよく伸びるのは徒長枝など。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"マツのみどり摘みは、秋に行うのが一般的である。",a:false,e:"みどり摘みは新芽が伸びる4〜5月ごろ。秋〜冬に行うのはもみあげ。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"サクラは切り口がすぐふさがるので、太い枝も積極的に切ってよい。",a:false,e:"サクラは切り口から腐りやすい。太い枝の剪定は避けるのが基本。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"三段切りは、太い枝を一度で切り落とす方法である。",a:false,e:"三段切りは3回に分けて切り、樹皮が裂けるのを防ぐ方法。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"透かし剪定は、刈込みばさみで樹冠の表面を一様に刈りそろえる剪定である。",a:false,e:"透かし剪定は、不要な枝を付け根から抜いて風通しをよくする剪定。表面を刈りそろえるのは刈込み。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"徒長枝には花芽が多くつくので、残しておくとよい。",a:false,e:"徒長枝は花芽がつきにくく、樹形を乱すので整理する。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"枝を付け根から切るときは、ブランチカラーごと深く切り込むと切り口が早くふさがる。",a:false,e:"ブランチカラーは残して切る。深く切ると切り口がふさがりにくい。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"切り詰め剪定で内芽のすぐ上を切ると、新しい枝は外側へ向かって伸びる。",a:false,e:"内芽の上で切ると枝は内側へ伸びる。外へ伸ばしたいときは外芽の上で切る。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"ウメの花芽は、長く伸びた徒長枝に多くつく。",a:false,e:"ウメの花芽は短い枝につく。徒長枝は切り詰めて短枝を出させる。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"四つ目垣は、向こう側が見えないようにする遮蔽垣である。",a:false,e:"四つ目垣は透かし垣の代表。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"建仁寺垣は、向こう側が透けて見える透かし垣である。",a:false,e:"建仁寺垣は立子をすき間なく並べた遮蔽垣。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"いぼ結び（男結び）はほどけやすいので、竹垣の結束には使わない。",a:false,e:"いぼ結びはゆるみにくく、竹垣の結束の基本。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"シュロ縄は、乾いたまま使うほうが締まりがよい。",a:false,e:"水に浸してから使うと、乾いたときに締まってゆるみにくい。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"竹垣の胴縁は、縦に並べて立てる竹のことである。",a:false,e:"胴縁は水平に渡す竹。縦に並べるのは立子。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"金閣寺垣は、背の高い遮蔽垣である。",a:false,e:"金閣寺垣は背の低い透かし垣（足元垣）。"},
{hot:1,cat:"竹垣・結束",ex:G,t:"tf",q:"竹を割るときは、根元側（元口）から刃を入れると割りやすい。",a:false,e:"竹は末口（先の方）から割る。「木元竹末」と覚える。"},
{hot:1,cat:"石組・園路",ex:G,t:"tf",q:"飛石の「合端」とは、地面から石の上面までの高さのことである。",a:false,e:"合端は石と石が向き合う部分とそのすき間。地面からの高さは「ちり」。"},
{cat:"石組・園路",ex:G,t:"tf",q:"雪見灯籠は、長い竿をもつ背の高い灯籠である。",a:false,e:"雪見灯籠は竿がなく、脚で支える低い灯籠。"},
{cat:"石組・園路",ex:G,t:"tf",q:"織部灯籠は、竿をもたず脚で笠を支える灯籠である。",a:false,e:"織部灯籠は竿を直接地面に埋め込む生け込み型。脚で支えるのは雪見灯籠。"},
{cat:"石組・園路",ex:GS,t:"tf",q:"空積みは、石と石の間にモルタルを詰めて積む方法である。",a:false,e:"空積みはモルタルなどを使わない。使うのは練積み。"},
{hot:1,cat:"石組・園路",ex:G,t:"tf",q:"蹲踞の前石は、手水鉢の向こう側（後ろ）に据える。",a:false,e:"前石は手水鉢の手前に据え、その上にかがんで手を洗う。"},
{cat:"石組・園路",ex:G,t:"tf",q:"沓脱石は、飛石の分かれ道に据える石である。",a:false,e:"沓脱石は縁先で履物を脱ぐための石。分かれ道に据えるのは踏分石。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"根回しは、移植する前日に行うのが最も効果的である。",a:false,e:"根回しは、新しい細根を出させるため、移植の半年〜1年前に行う。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"根鉢の直径は、根元直径と同じくらいで十分である。",a:false,e:"根鉢の直径は、根元直径の3〜5倍（4倍程度）が目安。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"八つ掛支柱は、生垣など列に植えた樹木を横木でつないで支える支柱である。",a:false,e:"列植を横木でつなぐのは布掛支柱。八つ掛支柱は丸太を斜めに3〜4本掛ける。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"移植した直後は、水を与えないほうが根が早く出る。",a:false,e:"植付け後はたっぷり水を与え、根と土をなじませる（水極め）。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"落葉樹の移植は、葉が茂っている真夏が適期である。",a:false,e:"落葉樹は、葉を落として休んでいる落葉期（晩秋〜早春）が適期。"},
{hot:1,cat:"植栽・移植",ex:G,t:"tf",q:"移植時の幹巻きは、幹を早く太らせるために行う。",a:false,e:"幹巻きは、幹からの水分の蒸散や日焼け・寒さから幹を守るために行う。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"支柱を取り付けるときは、シュロ縄で幹を直接きつく縛るのがよい。",a:false,e:"幹に杉皮などを巻いてから結束し、幹を傷めないようにする。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"肥料の三要素のうち、窒素は主に花や実のつきをよくするので「実肥」と呼ばれる。",a:false,e:"窒素は葉肥。花や実をよくするのはリン酸（花肥・実肥）。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"寒肥は、真夏に速く効く化学肥料を与えることである。",a:false,e:"寒肥は冬の休眠期に、ゆっくり効く有機質肥料を与えること。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"有機質肥料は、与えてすぐに効く速効性の肥料である。",a:false,e:"有機質肥料は、土の中で分解されてからゆっくり効く。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"団粒構造の土は、水はけも水もちも悪い。",a:false,e:"団粒構造の土は、水はけと水もちの両方がよい。"},
{cat:"芝生・地被",ex:G,t:"tf",q:"コウライシバは、寒さに強く暑さに弱い寒地型の芝である。",a:false,e:"コウライシバは暖地型の日本芝。冬は休眠して茶色になる。"},
{cat:"芝生・地被",ex:G,t:"tf",q:"芝のべた張りは、芝の間を広くあけて張る方法である。",a:false,e:"べた張りはすき間なく全面に張る。間をあけるのは目地張りなど。"},
{cat:"芝生・地被",ex:G,t:"tf",q:"エアレーションとは、芝生の上に砂や土を薄くまく作業のことである。",a:false,e:"エアレーションは土に穴をあける作業。砂や土をまくのは目土。"},
{cat:"芝生・地被",ex:G,t:"tf",q:"ノシバやコウライシバなどの日本芝は、冬も緑色を保つ。",a:false,e:"日本芝は冬に休眠して茶色くなる。冬も緑なのは寒地型の西洋芝。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"イチョウは雌雄同株で、どの木にもぎんなんがなる。",a:false,e:"イチョウは雌雄異株。ぎんなんがなるのは雌株だけ。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"アオキは日当たりのよい場所でしか育たない陽樹である。",a:false,e:"アオキは日陰に耐える陰樹。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"クスノキは、冬に葉を落とす落葉広葉樹である。",a:false,e:"クスノキは常緑広葉樹。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"メタセコイアは、冬も葉を落とさない常緑針葉樹である。",a:false,e:"メタセコイアは落葉針葉樹。秋に紅葉して落葉する。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"ジンチョウゲは細い根が多いので、移植に強い。",a:false,e:"ジンチョウゲは太い根が少なく、移植を嫌う。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"サンゴジュは燃えやすいので、防火樹には向かない。",a:false,e:"サンゴジュは葉が厚く水分が多いため燃えにくく、防火樹に使われる。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"ヒノキの葉の裏の白い気孔線はX字形に見える。",a:false,e:"ヒノキはY字形。X字形（またはH形）に見えるのはサワラ。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"トベラは潮風に弱いため、海岸近くには植えない。",a:false,e:"トベラは潮風に強く、海岸近くの植栽に向く。"},
{cat:"病害虫",ex:G,t:"tf",q:"チャドクガは、主にマツに発生する害虫である。",a:false,e:"チャドクガはツバキやサザンカに発生する。毒針毛に注意。"},
{cat:"病害虫",ex:G,t:"tf",q:"うどんこ病は、葉に黒いすすのようなカビが生える病気である。",a:false,e:"うどんこ病は白い粉のようなカビ。黒いすすのようになるのはすす病。"},
{cat:"病害虫",ex:G,t:"tf",q:"ボルドー液は、害虫を退治するための殺虫剤である。",a:false,e:"ボルドー液は硫酸銅と石灰で作る殺菌剤。"},
{cat:"病害虫",ex:G,t:"tf",q:"マツ材線虫病（松枯れ）は、アブラムシがマツノザイセンチュウを運んで広がる。",a:false,e:"マツノザイセンチュウを運ぶのはマツノマダラカミキリ。"},
{cat:"病害虫",ex:G,t:"tf",q:"サクラのてんぐ巣病にかかった枝は、切らずに残しておく。",a:false,e:"病気の枝は冬に切り取って処分する。"},
{cat:"病害虫",ex:G,t:"tf",q:"カイガラムシ防除のマシン油乳剤は、真夏の高温期に散布するのが基本である。",a:false,e:"マシン油乳剤は冬に散布するのが基本。夏の高温期は薬害が出やすい。"},
{cat:"病害虫",ex:G,t:"tf",q:"ハダニは、雨が多く湿った時期に多く発生する。",a:false,e:"ハダニは高温で乾燥した時期に多い。"},
{hot:1,cat:"安全衛生",ex:ALL,t:"tf",q:"脚立は、脚と水平面との角度を85度以上にして使う。",a:false,e:"脚と水平面との角度は75度以下とし、開き止めを確実にかける。"},
{cat:"安全衛生",ex:ALL,t:"tf",q:"10分間の平均風速が毎秒10m以上の強風のときでも、高さ2m以上での作業は続けてよい。",a:false,e:"強風・大雨・大雪のときは、高さ2m以上での危険な作業を中止する。"},
{cat:"安全衛生",ex:ALL,t:"tf",q:"移動はしごは、上端が上の床から突き出ないように掛けて使う。",a:false,e:"上端は上の床から60cm以上突き出させ、昇り降りしやすくする。"},
{hot:1,cat:"安全衛生",ex:ALL,t:"tf",q:"つり上げ荷重1t未満のクレーンの玉掛けは、教育を受けなくても誰でも行ってよい。",a:false,e:"1t未満は特別教育、1t以上は玉掛け技能講習が必要。"},
{cat:"安全衛生",ex:GS,t:"tf",q:"機体重量3t以上の車両系建設機械は、特別教育を受ければ運転できる。",a:false,e:"3t以上は技能講習が必要。特別教育で運転できるのは3t未満。"},
{cat:"安全衛生",ex:GS,t:"tf",q:"足場の作業床の幅は、20cm以上あればよい。",a:false,e:"作業床の幅は40cm以上、床材のすき間は3cm以下。"},
{cat:"安全衛生",ex:ALL,t:"tf",q:"保護帽は、一度大きな衝撃を受けても、見た目に傷がなければ使い続けてよい。",a:false,e:"大きな衝撃を受けた保護帽は、見た目に異常がなくても交換する。"},
{cat:"安全衛生",ex:GS,t:"tf",q:"空気中の酸素濃度が21%未満の状態を、酸素欠乏という。",a:false,e:"酸素欠乏は18%未満。空気中の酸素はふつう約21%。"},
{cat:"安全衛生",ex:G,t:"tf",q:"刈払機で作業するときは、周りの人と3m離れていれば十分である。",a:false,e:"刃に当たった石などが遠くまで飛ぶため、15m以内に人を近づけないのが目安。"},
{cat:"安全衛生",ex:ALL,t:"tf",q:"熱中症を防ぐには、のどが渇いてから水を飲めば十分である。",a:false,e:"のどが渇く前から、こまめに水分と塩分をとる。"},
{cat:"法規",ex:S,t:"tf",q:"建設業の許可の有効期間は3年である。",a:false,e:"建設業許可の有効期間は5年。続けるには更新が必要。"},
{cat:"法規",ex:GS,t:"tf",q:"都市公園法で、街区公園の標準的な誘致距離は1kmである。",a:false,e:"街区公園は250m。近隣公園が500m、地区公園が1km。"},
{cat:"法規",ex:S,t:"tf",q:"騒音規制法で、特定建設作業の騒音の規制基準（敷地境界線上）は75dBである。",a:false,e:"騒音は85dB。75dBは振動規制法の振動の基準。"},
{cat:"法規",ex:S,t:"tf",q:"建設リサイクル法の特定建設資材には、プラスチックが含まれる。",a:false,e:"特定建設資材はコンクリート、コンクリート及び鉄から成る資材、木材、アスファルト・コンクリートの4つ。"},
{cat:"法規",ex:S,t:"tf",q:"労働基準法では、休日は2週間に1回与えればよい。",a:false,e:"原則として毎週少なくとも1回、または4週間を通じて4日以上。"},
{cat:"法規",ex:S,t:"tf",q:"使用者は、7日前に予告すれば労働者を解雇できる。",a:false,e:"解雇の予告は原則として30日前まで。"},
{cat:"法規",ex:S,t:"tf",q:"産業廃棄物管理票（マニフェスト）の写しの保存期間は1年である。",a:false,e:"マニフェストの写しは5年間保存する。"},
{cat:"法規",ex:S,t:"tf",q:"騒音規制法の特定建設作業の届出は、作業を始める前日までに行えばよい。",a:false,e:"作業開始の7日前までに市町村長に届け出る。"},
{cat:"法規",ex:GS,t:"tf",q:"都市公園に設ける建築物の建築面積の合計は、原則として公園の敷地面積の10%まで認められる。",a:false,e:"原則は2%まで。例外で上乗せされる場合がある。"},
{cat:"施工管理",ex:S,t:"tf",q:"クリティカルパスは、ネットワーク工程表の中で最も日数の短い経路である。",a:false,e:"クリティカルパスは最も日数の長い経路で、工期を決める。"},
{cat:"施工管理",ex:S,t:"tf",q:"バーチャートは、作業どうしの前後関係がはっきり分かる工程表である。",a:false,e:"バーチャートは見やすいが、作業の前後関係は分かりにくい。前後関係が分かるのはネットワーク式。"},
{cat:"施工管理",ex:S,t:"tf",q:"パレート図は、2つの特性の相関関係を調べるための図である。",a:false,e:"相関を見るのは散布図。パレート図は不良項目を多い順に並べ、重点を見つける図。"},
{cat:"施工管理",ex:S,t:"tf",q:"特性要因図は、データのばらつきの分布を柱状に表した図である。",a:false,e:"分布を柱状に表すのはヒストグラム。特性要因図は原因を魚の骨の形に整理する図。"},
{cat:"土木・材料",ex:S,t:"tf",q:"寒中コンクリートとしての対策は、日平均気温が25℃を超えると予想されるときに行う。",a:false,e:"寒中コンクリートは日平均気温4℃以下のとき。25℃を超えるときは暑中コンクリート。"},
{cat:"土木・材料",ex:S,t:"tf",q:"外気温が25℃を超えるとき、コンクリートの練混ぜから打込み終了までの時間は3時間以内とする。",a:false,e:"25℃を超えるときは1.5時間以内、25℃以下では2時間以内。"},
{cat:"土木・材料",ex:S,t:"tf",q:"鉄筋のかぶりは、大きくするほど鉄筋がさびやすくなる。",a:false,e:"かぶりが大きいほど、鉄筋は外の空気や水から守られ、さびにくい。"},
{cat:"施工管理",ex:S,t:"tf",q:"水準測量では、求める点の標高＝既知点の標高−後視＋前視で計算する。",a:false,e:"正しくは、既知点の標高＋後視−前視。"},
{cat:"施工管理",ex:GS,t:"tf",q:"高木の幹周は、地際（根元の地面の位置）で測る。",a:false,e:"幹周は地際から1.2mの高さで測る。"},
{cat:"施工管理",ex:S,t:"tf",q:"バックホウは、機械が置かれた地盤より高い所の掘削に最も適している。",a:false,e:"バックホウは低い所の掘削向き。高い所の掘削にはローディングショベルが向く。"},
{cat:"施工管理",ex:S,t:"tf",q:"指定仮設は、施工者が自分の判断で自由に構造を変えてよい。",a:false,e:"指定仮設は発注者が契約で指定したもの。変更には発注者との協議が必要。"},
// ───────── 2026-10-21 追加⑤：施工管理の×問題と4択
{cat:"法規",ex:S,t:"tf",q:"監理技術者は、下請として工事を請け負った場合でも、必ず置かなければならない。",a:false,e:"監理技術者が必要なのは、元請（特定建設業者）が一定額以上を下請に出す場合。下請の現場には主任技術者を置く。"},
{cat:"法規",ex:S,t:"tf",q:"元請として工事を請け負った場合は、工事現場に主任技術者を置かなくてよい。",a:false,e:"元請でも下請でも、工事現場には主任技術者（場合により監理技術者）を置く。"},
{cat:"法規",ex:S,t:"tf",q:"一般建設業の許可があれば、元請として下請に出す金額に制限はない。",a:false,e:"元請として一定額以上の下請契約を結ぶには、特定建設業の許可が必要。"},
{cat:"法規",ex:S,t:"tf",q:"工事現場の現場代理人は、主任技術者を兼ねることができる。",a:true,e:"契約上、現場代理人と主任技術者（監理技術者）は同じ人が兼ねてよい。"},
{cat:"法規",ex:S,t:"tf",q:"労働基準法では、労働時間が6時間を超える場合、休憩は少なくとも15分与えればよい。",a:false,e:"6時間を超える場合は45分以上、8時間を超える場合は1時間以上の休憩が必要。"},
{cat:"法規",ex:S,t:"tf",q:"年次有給休暇は、1年以上続けて勤めないと与えられない。",a:false,e:"6か月続けて勤め、出勤率8割以上なら10日の年次有給休暇が与えられる。"},
{cat:"法規",ex:S,t:"tf",q:"都市公園の一部を電柱などのために占用するときは、公園管理者に届け出るだけでよい。",a:false,e:"都市公園の占用には、公園管理者の許可が必要。"},
{cat:"法規",ex:S,t:"tf",q:"道路に工作物を設けて継続して使う道路占用の許可は、警察署長が出す。",a:false,e:"道路占用許可は道路管理者。警察署長が出すのは、工事などで一時的に使う道路使用許可。"},
{cat:"法規",ex:S,t:"tf",q:"建設工事で出た廃棄物は、実際に作業をした下請業者が排出事業者となる。",a:false,e:"建設工事の廃棄物は、元請業者が排出事業者として処理の責任を負う。"},

window.TIPS = [
// ───────── 縁起・名前の由来
{c:"縁起・名前",t:"南天は「難を転ずる」",b:"ナンテンは「難転」に通じる縁起木。玄関や鬼門（北東）に植えられてきた。お赤飯に葉を添えるのは、彩りと縁起かつぎのため。",s:"玄関に南天がありますね。昔からこの場所に植える理由があるの、ご存じですか？"},
{c:"縁起・名前",t:"千両・万両・百両・十両・一両",b:"赤い実の縁起木は、センリョウ・マンリョウ・カラタチバナ（百両）・ヤブコウジ（十両）・アリドオシ（一両）。並べて「千両万両有り通し（いつもお金がある）」と縁起をかつぐ。",s:"お正月に飾る赤い実の木、千両・万両のほかにもまだ仲間がいるんですよ。"},
{c:"縁起・名前",t:"千両と万両の見分け方",b:"センリョウは実が葉の上に上向きにつく。マンリョウは実が葉の下に垂れ下がる。「万両のほうが実が重くて垂れる」と覚えると早い。",s:"この赤い実、千両と万両のどっちだと思います？見分け方が簡単なんです。"},
{c:"縁起・名前",t:"ユズリハは家が続く木",b:"春に新しい葉が出てから古い葉が落ちる。親から子へ「譲る」姿から名がつき、家が代々続く縁起物として正月飾りにも使われる。",s:"お正月飾りの葉っぱ、なぜ「家が続く」縁起物なのか、ちょっと面白い理由があるんです。"},
{c:"縁起・名前",t:"柊（ヒイラギ）と節分",b:"トゲのある葉が鬼の目を刺すとされ、節分に柊の枝に鰯の頭を刺して戸口に飾る（柊鰯）。表鬼門に植える家もある。",s:"節分に柊を飾るお家、最近は少なくなりましたね。何のために飾るかご存じですか？"},
{c:"縁起・名前",t:"年をとると丸くなる柊",b:"ヒイラギの葉のトゲは、木が年を重ねて大きくなると少なくなり、丸い葉が増えると言われる。上の方の手の届かない枝ほど丸くなりやすい。",s:"この柊、上の方の葉っぱを見てください。下の葉と形が違いませんか？"},
{c:"縁起・名前",t:"松竹梅の意味",b:"松と竹は冬も緑を保ち、梅は寒い中で最初に花を咲かせる。寒さに負けない「歳寒三友」として中国から伝わった、おめでたい組み合わせ。",s:"「松竹梅」って、なぜこの3つがおめでたいのか考えたことあります？"},
{c:"縁起・名前",t:"ヤマボウシは「山法師」",b:"白い花（本当は総苞）の真ん中の丸い部分を坊主頭、白い4枚を頭巾に見立てて、山の法師（僧兵）の姿にたとえた。",s:"ヤマボウシの花、何かの姿に見えませんか？名前の由来がそこにあるんです。"},
{c:"縁起・名前",t:"ドウダンツツジは「灯台」",b:"枝の分かれ方が、昔の照明「結び灯台」の脚に似ていることから「灯台（とうだい）」がなまって「ドウダン」になったと言われる。漢字は「満天星」。",s:"ドウダンツツジって変わった名前ですよね。実は昔の道具から来ているんです。"},
{c:"縁起・名前",t:"サルスベリは猿も滑る",b:"幹の皮がはがれてつるつるになるので、猿も登れず滑るという名。漢字の「百日紅」は、夏から秋まで百日ほど花が続くことから。",s:"サルスベリの幹、触ってみてください。名前の意味がすぐ分かりますよ。"},
{c:"縁起・名前",t:"エゴノキは「えぐい」",b:"実の皮をなめると、えぐい（のどがいがらっぽい）ことから名がついたと言われる。実の皮には泡立つ成分があり、昔は洗濯に使われた。",s:"エゴノキの「エゴ」って何のことだと思います？"},
{c:"縁起・名前",t:"ネズミモチの名前",b:"黒い実がネズミのフンに、葉がモチノキに似ていることから。生垣によく使われる丈夫な木。",s:"ネズミモチ、名前にネズミが入っているのはなぜだと思います？"},
{c:"縁起・名前",t:"アセビは「馬酔木」",b:"葉に毒があり、馬が食べると酔ったようにふらつくことから「馬酔木」と書く。奈良公園の鹿も食べないので、アセビが多く残っている。",s:"アセビは漢字で書くと、ちょっと怖い意味があるんですよ。"},
{c:"縁起・名前",t:"ナツツバキと「沙羅双樹」",b:"お寺で「沙羅双樹」と呼ばれる木の多くは、日本ではナツツバキ。本物の沙羅双樹はインドの熱帯の木で、日本の気候では育ちにくいため代わりにされた。",s:"お寺の「沙羅双樹」、実は日本では別の木のことが多いんです。"},
{c:"縁起・名前",t:"お寺の菩提樹",b:"お釈迦様が悟りを開いたのはインドボダイジュ（クワ科）。日本のお寺の菩提樹は、多くが中国原産のシナノキ科のボダイジュで、別の木。",s:"お寺の菩提樹、お釈迦様の木とは違う木だってご存じでした？"},
{c:"縁起・名前",t:"椿と武士の俗説",b:"ツバキは花ごとポトリと落ちるので「首が落ちる」と武士が嫌ったという話は、江戸時代以降の俗説とされる。江戸時代には将軍や大名の間で椿の園芸がブームだった。",s:"「椿は首が落ちるから縁起が悪い」って聞いたことあります？あれ、実は…"},
{c:"縁起・名前",t:"枇杷を植えると…という迷信",b:"「ビワを庭に植えると病人が出る」という言い伝えがある。ビワの葉が薬として使われ、病人のいる家によく植えられていたことから生まれた迷信と言われる。",s:"「枇杷を庭に植えると病人が出る」って言われたことありませんか？"},
{c:"縁起・名前",t:"「根回し」は庭師の言葉",b:"交渉ごとの「根回し」は、もともと木を移植する前に根の周りを掘って細い根を出させる作業のこと。前もって準備して、本番でうまく根づかせる意味が広がった。",s:"「根回し」って、もともと庭師の言葉なのをご存じですか？"},
{c:"縁起・名前",t:"橘（タチバナ）と右近の橘",b:"京都御所の紫宸殿の前には「左近の桜・右近の橘」が植えられている。タチバナは日本に昔からある野生のミカンの仲間で、常緑で長寿の象徴とされた。",s:"ひな人形の「右近の橘」、実物を見たことはありますか？"},
// ───────── 剪定の知恵
{c:"剪定の知恵",t:"桜切る馬鹿、梅切らぬ馬鹿",b:"サクラは切り口から腐りやすく、むやみに切ると弱る。ウメは切らないと枝が混み合って花つきが悪くなる。木によって剪定の向き不向きが違うという教え。",s:"「桜切る馬鹿、梅切らぬ馬鹿」って聞いたことあります？"},
{c:"剪定の知恵",t:"切るのは「外芽」の上",b:"枝を途中で切るときは、外側を向いた芽のすぐ上で切ると、新しい枝が外へ伸びて自然な形になる。内向きの芽の上で切ると枝が内側へ伸びて混み合う。",s:"この枝、どこで切るかで来年の伸び方が全然変わるんですよ。"},
{c:"剪定の知恵",t:"透かしは「風の通り道」",b:"枝を付け根から抜いて混み具合を減らすと、風と光が中まで入る。病害虫が減り、下の方の枝も枯れにくくなる。",s:"木の中まで風が通ると、どうなると思います？"},
{c:"剪定の知恵",t:"忌み枝は「切っていい枝」の目印",b:"逆さ枝・からみ枝・徒長枝・胴吹き枝・ひこばえ・車枝など、樹形を乱す枝をまとめて忌み枝と呼ぶ。まずこれを落とすと、どこを切るか迷いにくい。",s:"切る枝を決めるとき、まず探す「切っていい枝」があるんです。"},
{c:"剪定の知恵",t:"太い枝は三段切り",b:"太い枝をいきなり付け根で切ると、重みで樹皮が裂ける。下から切れ目→少し先を上から切り落とす→残りを付け根で切る、の3回に分ける。",s:"太い枝を切るとき、一回で切らないのには理由があるんです。"},
{c:"剪定の知恵",t:"ブランチカラーを残す",b:"枝の付け根にある少しふくらんだ部分（ブランチカラー）は、切り口をふさぐ組織がある所。ここを残して切ると、傷口が早く巻き込まれる。",s:"枝の付け根にちょっとふくらみがありますよね。ここが大事なんです。"},
{c:"剪定の知恵",t:"花木は「花が終わったらすぐ」",b:"ツツジ・サツキ・アジサイなど多くの花木は、花が終わった後の夏に翌年の花芽を作る。秋や冬に切ると花芽ごと落としてしまう。",s:"「去年切ってもらったら花が咲かなかった」ってことありませんでした？"},
{c:"剪定の知恵",t:"落葉樹の剪定は冬",b:"葉が落ちた冬は枝の形がよく見え、木も休んでいるので負担が少ない。骨格をつくる強めの剪定は、落葉期に行うのが基本。",s:"葉っぱが落ちた冬は、実は剪定にいちばん向いている時期なんです。"},
{c:"剪定の知恵",t:"松の手入れは年2回",b:"春（4〜5月）に新芽を摘む「みどり摘み」で伸びすぎを抑え、秋〜冬（11〜12月頃）に古い葉を抜く「もみあげ」で光と風を通す。",s:"松の手入れって、年に何回するかご存じですか？"},
{c:"剪定の知恵",t:"生垣は「上を狭く、下を広く」",b:"台形に刈ると下の枝まで日が当たり、下が枯れ上がりにくい。上が広い逆台形にすると、数年で足元がスカスカになる。",s:"生垣の下のほうがスカスカになっていませんか？形に原因があるんです。"},
{c:"剪定の知恵",t:"強く切ると暴れる",b:"一度に強く切りすぎると、木は失った葉を取り戻そうとして徒長枝（勢いのいい枝）をたくさん出す。結果、翌年かえって形が乱れる。",s:"「強く切ったのに、すぐ元どおり」って感じたことありません？"},
{c:"剪定の知恵",t:"切り口に塗る薬",b:"太い枝の切り口には癒合剤（ゆごうざい）を塗ると、乾燥や腐朽菌の侵入を防げる。特にサクラやカエデなど切り口が弱い木に効果的。",s:"太い枝を切ったところ、何か塗ってあるのに気づきました？"},
{c:"剪定の知恵",t:"カエデは冬に切る",b:"モミジやカエデは春先に切ると切り口から樹液がたくさん出る。樹液の動きが止まる落葉期に剪定するのが基本。",s:"モミジは切る時期を間違えると、木が「泣く」んですよ。"},
{c:"剪定の知恵",t:"刈込みは「年2回」が目安",b:"生垣や玉物は、新芽が伸びた初夏と、秋の年2回刈ると形を保ちやすい。花の咲く木は花が終わってから。",s:"生垣の刈込み、年に何回くらいがちょうどいいと思います？"},
// ───────── 季節の手入れ
{c:"季節の手入れ",t:"寒肥とお礼肥",b:"冬（1〜2月頃）にゆっくり効く有機質の肥料を与えるのが寒肥（かんごえ）。花や実の後に体力を戻すために与えるのがお礼肥（おれいごえ）。",s:"冬に木に肥料をやる理由、ご存じですか？"},
{c:"季節の手入れ",t:"肥料は枝先の真下に",b:"養分を吸う細い根は、幹の近くではなく、枝が広がっている先の真下あたりに多い。幹の根元に置いてもあまり吸われない。",s:"肥料、幹の根元に置いていませんか？実は効く場所があるんです。"},
{c:"季節の手入れ",t:"夏の水やりは朝か夕方",b:"真昼に水をやると、ホースの中で温まった水や地面の熱で根を傷めることがある。夏は朝の涼しいうちか夕方に、たっぷり与える。",s:"夏の水やり、何時ごろにしてます？時間で木の元気が変わるんです。"},
{c:"季節の手入れ",t:"雪吊り（りんご吊り）",b:"雪の重みで枝が折れないよう、柱の先から縄を張って枝を吊る冬の作業。金沢の兼六園の雪吊りは、冬の風物詩として有名。",s:"金沢の兼六園の雪吊り、テレビで見たことあります？"},
{c:"季節の手入れ",t:"こも巻き",b:"冬にマツの幹にわらのこもを巻き、冬越しの虫を集めて春先に焼く伝統行事。ただし益虫も集まるため、効果は小さいという研究もある。",s:"冬に松の幹にわらを巻いてあるの、見たことありますか？"},
{c:"季節の手入れ",t:"紅葉と黄葉のしくみ",b:"秋に葉の緑の色素（葉緑素）が分解されると、隠れていた黄色の色素が見えて黄葉に。赤い色は、秋に新しく作られるアントシアニンという色素による。",s:"葉っぱが黄色くなるのと赤くなるの、しくみが違うってご存じですか？"},
{c:"季節の手入れ",t:"紅葉がきれいな年",b:"昼が晴れて夜が冷え込む、寒暖差のある秋ほど赤い色素が多くでき、紅葉が鮮やかになると言われる。",s:"今年の紅葉、きれいな年になりそうか分かる目安があるんですよ。"},
{c:"季節の手入れ",t:"芝生の冬の茶色",b:"コウライシバやノシバなどの日本芝は、冬に休眠して茶色くなる。枯れたわけではなく、春に暖かくなるとまた緑に戻る。",s:"冬に芝が茶色くなって、枯れたと心配されていませんか？"},
{c:"季節の手入れ",t:"芝刈りは「3分の1」まで",b:"一度に葉の長さの3分の1以上刈ると、芝が弱って茶色くなりやすい。伸ばしすぎた時は数回に分けて低くする。",s:"芝刈りのとき、どのくらいの長さまで刈っています？"},
{c:"季節の手入れ",t:"植え替えに向く季節",b:"落葉樹は葉が落ちている晩秋〜早春、常緑樹は新芽の出る前の春か梅雨どき、寒さに弱い木は春が向く。真夏と真冬は避けるのが基本。",s:"木を植え替えたいとき、いつがいいと思います？"},
{c:"季節の手入れ",t:"梅雨は「挿し木」の季節",b:"湿度が高く、新しい枝が少し固まる梅雨どきは、多くの木の挿し木に向く。アジサイなどは家庭でも挿し木しやすい。",s:"アジサイ、ご自分で増やしてみたいと思ったことありませんか？"},
// ───────── 樹木のふしぎ
{c:"樹木のふしぎ",t:"ソメイヨシノはみんな「クローン」",b:"ソメイヨシノは江戸時代末期に染井村（今の東京都豊島区）の植木屋から広まったとされる。種では同じ木にならないので、接ぎ木で増やされ、各地の木は同じ遺伝子を持つ。",s:"日本中のソメイヨシノ、実はみんな「同じ木」だって知ってました？"},
{c:"樹木のふしぎ",t:"ソメイヨシノの親",b:"エドヒガンとオオシマザクラの交雑から生まれたと考えられている。だから一斉に咲き、一斉に散る。",s:"ソメイヨシノのお父さんとお母さん、何の桜かご存じですか？"},
{c:"樹木のふしぎ",t:"桜餅の香り",b:"桜餅の葉はオオシマザクラの葉の塩漬け。生の葉にはほとんど香りがなく、塩漬けにするとクマリンという香りの成分ができる。",s:"桜餅の香り、生の桜の葉っぱからはしないって知ってました？"},
{c:"樹木のふしぎ",t:"イチョウは「生きた化石」",b:"イチョウの仲間は恐竜の時代から姿をほとんど変えずに残っている。今のイチョウは1属1種だけが生き残った。",s:"イチョウって、恐竜と同じ時代からある木なんですよ。"},
{c:"樹木のふしぎ",t:"銀杏がなるのは雌の木だけ",b:"イチョウは雄の木と雌の木が分かれている。ぎんなん（実）がなるのは雌の木だけなので、街路樹には臭いの出ない雄の木を選ぶことが多い。",s:"このイチョウ、ぎんなんはなりますか？実はなる木とならない木があるんです。"},
{c:"樹木のふしぎ",t:"金木犀は日本にほぼ雄だけ",b:"キンモクセイは中国原産で、江戸時代に日本に入ったとされる。日本にあるのはほとんどが雄の木で、実はならず、挿し木で増やされてきた。",s:"金木犀、実がなっているのを見たことありますか？"},
{c:"樹木のふしぎ",t:"日本三大芳香木",b:"春のジンチョウゲ、夏のクチナシ、秋のキンモクセイ。季節ごとに香りで知らせてくれる3本。",s:"春・夏・秋、香りで季節を知らせてくれる木が3本あるんです。"},
{c:"樹木のふしぎ",t:"紫陽花の色は土で変わる",b:"土が酸性だとアルミニウムが溶けて根から吸われ、青くなる。中性〜アルカリ性だと赤っぽくなる。同じ株でも土で色が変わる。",s:"このアジサイ、去年と色が違っていませんか？"},
{c:"樹木のふしぎ",t:"紫陽花の「花」は飾り",b:"花びらに見える部分は萼（がく）が大きくなった装飾花。本当の花は真ん中の小さな粒々。",s:"アジサイの「花」、どこが本当の花だと思います？"},
{c:"樹木のふしぎ",t:"ハナミズキはアメリカからのお返し",b:"1912年に東京市（当時）がアメリカのワシントンへサクラを贈り、そのお返しとして1915年にハナミズキが日本に贈られた。",s:"ハナミズキって、どこから来た木かご存じですか？"},
{c:"樹木のふしぎ",t:"竹の花は数十年に一度",b:"竹は何十年もかけて地下茎で増え、ある時一斉に花を咲かせて枯れることがある。マダケは約120年周期と言われるが、記録が少なく分かっていないことも多い。",s:"竹の花、ご覧になったことありますか？めったに見られないんです。"},
{c:"樹木のふしぎ",t:"竹は1日に1m以上伸びることも",b:"タケノコの時期は成長が非常に早く、1日に1m以上伸びた記録もある。数か月で親と同じ高さになり、その後は太くも高くもならない。",s:"タケノコって、一日でどのくらい伸びると思います？"},
{c:"樹木のふしぎ",t:"竹は草？木？",b:"竹は木のように硬いが、木のように年々太くならない。植物学でも草とも木とも言いにくい、独特の植物とされる。",s:"竹は「木」だと思います？それとも「草」？"},
{c:"樹木のふしぎ",t:"根は枝より広く張る",b:"多くの木の根は、枝が広がる範囲より外まで広がる。根の多くは地表近くの浅い所にあるので、根元の土を踏み固めないことが大切。",s:"木の根っこ、どこまで広がっていると思います？"},
{c:"樹木のふしぎ",t:"年輪の南側が広い、は俗説",b:"「切り株の年輪は南側が広い」と言われるが、実際は傾きや風、枝の付き方などで決まり、方角の目印にはならない。",s:"「年輪の広い方が南」って、学校で習いませんでした？"},
{c:"樹木のふしぎ",t:"世界一高い木",b:"アメリカのレッドウッド国立公園にあるセコイアの仲間「ハイペリオン」は、高さ約116mで、現在知られている世界一高い木。",s:"世界でいちばん高い木って、何メートルくらいだと思います？"},
{c:"樹木のふしぎ",t:"日本一の大楠",b:"鹿児島県の「蒲生の大楠」は、幹回り約24mの日本一の巨樹として知られる。クスノキは長生きで大きくなる木。",s:"日本でいちばん大きな木、どこにあるかご存じですか？"},
{c:"樹木のふしぎ",t:"縄文杉の年齢",b:"屋久島の縄文杉は、樹齢2000年以上と言われるが、7000年以上という説もあり、正確な年齢は分かっていない。",s:"屋久島の縄文杉、何歳くらいだと思います？"},
{c:"樹木のふしぎ",t:"クスノキと樟脳",b:"クスノキの葉や木には樟脳（しょうのう）の成分があり、もむとスーッとした香りがする。昔は防虫剤に使われた。",s:"この楠の葉っぱ、ちょっともんで香りをかいでみてください。"},
{c:"樹木のふしぎ",t:"燃えにくい木",b:"サンゴジュやイチョウ、ヤツデなど、葉が厚く水分の多い木は燃えにくく、昔から火除け・防火の生垣として使われてきた。",s:"火事に強い木があるって聞いたことあります？"},
{c:"樹木のふしぎ",t:"潮風に強い木",b:"トベラ・ウバメガシ・マサキ・シャリンバイ・クロマツなどは潮風に強く、海沿いの庭や防風林に向く。",s:"海の近くのお庭、どんな木が向いているかご存じですか？"},
{c:"樹木のふしぎ",t:"クロマツは「雄松」",b:"葉が硬く樹皮が黒っぽいクロマツは「雄松（おまつ）」、葉がやわらかく樹皮が赤いアカマツは「雌松（めまつ）」と呼ばれる。",s:"松にも「男」と「女」があるの、ご存じですか？"},
{c:"樹木のふしぎ",t:"藤のつるは種類で巻き方が違う",b:"よく植えられるノダフジと、山に多いヤマフジは、つるの巻く向きが逆になる。棚を作るときは向きに合わせて誘引するとよい。",s:"藤のつる、どっち巻きか見たことあります？"},
{c:"樹木のふしぎ",t:"桃栗三年柿八年",b:"実がなるまでの年数のたとえ。続きに「柚子の大馬鹿十八年」「梅は酸い酸い十三年」など、地域によってさまざまな続きがある。",s:"「桃栗三年柿八年」、続きがあるのをご存じですか？"},
{c:"樹木のふしぎ",t:"苔は日本に約1700種",b:"日本はコケの種類が多い国で、約1700種あると言われる。京都の西芳寺（苔寺）では100種以上の苔が見られる。",s:"お庭の苔、日本に何種類くらいあると思います？"},
{c:"樹木のふしぎ",t:"サザンカとツバキの見分け",b:"サザンカは花びらが1枚ずつ散り、ツバキは花ごと落ちる。サザンカは秋〜初冬、ツバキは冬〜春に咲く。若い枝に毛があるのはサザンカ。",s:"この花、サザンカとツバキのどっちだと思います？"},
// ───────── 庭の歴史・文化
{c:"庭の歴史・文化",t:"龍安寺の15の石",b:"龍安寺の石庭には15個の石があるが、縁側のどこから見ても1つは他の石に隠れて14個しか見えないように配置されていると言われる。",s:"龍安寺の石庭、行かれたことありますか？石の置き方に仕掛けがあるんです。"},
{c:"庭の歴史・文化",t:"日本三名園",b:"兼六園（金沢）・後楽園（岡山）・偕楽園（水戸）。兼六園の名は、宏大・幽邃・人力・蒼古・水泉・眺望の6つの景観を兼ねることから。",s:"日本三名園、3つとも言えます？"},
{c:"庭の歴史・文化",t:"枯山水",b:"水を使わず、白砂や石で川や海を表す庭。砂に描く波の模様は、熊手のような道具で毎日のように引き直される。",s:"水を使わないのに「川」や「海」を表す庭、ご存じですか？"},
{c:"庭の歴史・文化",t:"借景",b:"庭の外の山や木などを、庭の景色の一部として取り込む手法。京都の円通寺は比叡山を借景にした庭として有名。",s:"お庭から見えるあの山も、景色の一部にできるんですよ。"},
{c:"庭の歴史・文化",t:"鹿威し（ししおどし）",b:"竹に水がたまるとカコンと鳴る仕掛け。もともとは田畑を荒らす鹿や猪を音で追い払うための道具だった。",s:"「カコーン」と鳴る竹の仕掛け、もともと何のための物か知ってます？"},
{c:"庭の歴史・文化",t:"蹲踞（つくばい）の名前",b:"茶室に入る前に、しゃがんで（つくばって）手を洗うための手水鉢を中心にした石組み。低く据えるので、自然と頭を下げる形になる。",s:"つくばい、なぜあんなに低い所に置いてあるか分かります？"},
{c:"庭の歴史・文化",t:"飛石は「渡り六分、景四分」",b:"千利休は、飛石は歩きやすさ（渡り）六分、見た目（景）四分がよいとした。古田織部は逆に「渡り四分、景六分」としたと伝わる。",s:"飛石、歩きやすさと見た目、どっちを大事にして置くと思います？"},
{c:"庭の歴史・文化",t:"石灯籠はもともとお寺の灯り",b:"石灯籠は寺社に灯りを献じるためのものだった。茶人たちが露地（茶庭）に取り入れ、庭の飾りとして広まった。",s:"石灯籠って、もともとは庭の飾りじゃなかったんですよ。"},
{c:"庭の歴史・文化",t:"建仁寺垣の名前",b:"京都の建仁寺で使われたのが始まりと言われる竹垣。割竹を縦にすき間なく並べる、目隠しの垣の代表。",s:"この竹垣、お寺の名前がついているんです。"},
{c:"庭の歴史・文化",t:"日比谷公園は日本初の洋風公園",b:"1903年（明治36年）に開園した、日本で最初の本格的な西洋風の公園。設計も施工も日本人の手による。",s:"日本で最初の西洋風の公園、どこかご存じですか？"},
{c:"庭の歴史・文化",t:"江戸の植木の里",b:"江戸時代、駒込・染井（今の東京都豊島区）は植木屋が集まる「植木の里」だった。ソメイヨシノもここから広まった。",s:"ソメイヨシノの「染井」って、地名なのをご存じでした？"},
{c:"庭の歴史・文化",t:"大刈込",b:"ツツジなどを大きくまとめて刈り込み、山や波に見立てる手法。江戸時代初期の小堀遠州が多く用いたとされる。",s:"ツツジを大きく刈り込んで、山や波に見立てる庭を見たことあります？"},
{c:"庭の歴史・文化",t:"盆栽は世界語",b:"盆栽（BONSAI）は海外でもそのまま通じる言葉になっている。小さな鉢の中に大自然の景色を表す、日本の園芸文化。",s:"「盆栽」って、海外でもそのまま通じるの知ってました？"},
{c:"庭の歴史・文化",t:"飛梅の伝説",b:"菅原道真が京都から太宰府へ左遷されたとき、愛した梅が一夜で後を追って飛んできたという伝説。太宰府天満宮に「飛梅」がある。",s:"梅が空を飛んだっていう伝説、聞いたことあります？"},
{c:"庭の歴史・文化",t:"春の七草・秋の七草",b:"春の七草は食べて無病息災を願う（せり・なずな・ごぎょう・はこべら・ほとけのざ・すずな・すずしろ）。秋の七草は眺めて楽しむ（萩・尾花・葛・撫子・女郎花・藤袴・桔梗）。",s:"春の七草は食べるもの。じゃあ秋の七草は何をするものだと思います？"},
{c:"庭の歴史・文化",t:"「紅葉狩り」の狩り",b:"「狩り」はもともと獣をとることだったが、平安時代の貴族が山へ出かけて草花や紅葉を眺めることにも使われるようになったと言われる。",s:"紅葉は見るだけなのに、なぜ「狩り」って言うんでしょうね？"},
{c:"庭の歴史・文化",t:"生垣は防災にもなる",b:"ブロック塀は地震で倒れる危険があるが、生垣は倒れにくく、延焼を遅らせる効果もある。生垣づくりに助成金を出している自治体もある（条件は自治体ごとに確認）。",s:"ブロック塀と生垣、地震のときに安心なのはどっちだと思います？"},
// ───────── 石・竹・道具
{c:"石・竹・道具",t:"植木屋の三脚脚立",b:"脚が3本の脚立は、でこぼこの地面や生垣の際でも立てやすく、木の懐に1本脚を差し込める。庭師の道具の代表。",s:"この三本脚の脚立、なぜ庭師はこれを使うと思います？"},
{c:"石・竹・道具",t:"金物の町・三木",b:"兵庫県三木市は鋸・鑿・鉋・鏝・小刀などの金物の産地として知られ、植木鋏や剪定鋏の名工も多い。",s:"庭師の鋏の名産地、どこかご存じですか？"},
{c:"石・竹・道具",t:"竹は秋から冬に切る",b:"竹は水分や養分の少ない秋〜冬に切ると虫がつきにくく長持ちする。昔から「竹の伐採は秋から冬」と言われる。",s:"竹を切るのにいい季節があるんですよ。いつだと思います？"},
{c:"石・竹・道具",t:"竹は先から割る",b:"「木元竹末（きもとたけうら）」と言い、木は根元側から、竹は先の方から刃を入れると割りやすい。",s:"竹を割るとき、上と下どっちから刃を入れると思います？"},
{c:"石・竹・道具",t:"シュロ縄は水に浸す",b:"シュロ縄は水に浸してから結ぶと、乾いたときに縮んで締まり、結び目がゆるみにくくなる。",s:"この縄、結ぶ前に水につけるのには理由があるんです。"},
{c:"石・竹・道具",t:"男結び",b:"竹垣の結束に使う結び方で、ゆるみにくく、見た目も美しい。庭師の基本の技のひとつ。",s:"竹垣の結び目、ほどけにくい特別な結び方があるんですよ。"},
{c:"石・竹・道具",t:"飛石の高さ",b:"飛石は地面から3〜6cmほど出すのが目安。高すぎるとつまずき、低すぎると雨で埋もれる。",s:"飛石、地面からどのくらい出ていると歩きやすいと思います？"},
{c:"石・竹・道具",t:"石には「顔」がある",b:"庭石には一番見栄えのよい面（見付け）がある。据える前に石をよく見て、顔を正面に向け、安定する向きで据える。",s:"庭の石にも「顔」があるのをご存じですか？"},
{c:"石・竹・道具",t:"砂利とウッドチップ",b:"砂利を敷くと雑草が減り、歩くと音がするので防犯にもなる。剪定枝を砕いたウッドチップは、土の乾燥防止や雑草よけになる。",s:"足元を砂利にすると、雑草のほかにもいいことがあるんです。"},
{c:"石・竹・道具",t:"剪定枝はチップに",b:"剪定で出た枝葉を細かく砕いてチップにすれば、マルチング（地面のおおい）や堆肥として庭に戻せる。",s:"剪定で出た枝、ゴミにしないで庭で使う方法があるんですよ。"},
// ───────── 虫と病気・安全
{c:"虫と病気",t:"チャドクガに注意",b:"ツバキやサザンカにつくチャドクガの幼虫は、毒の毛でかぶれる。抜け殻や死骸、風で飛んだ毛でもかぶれるので、洗濯物にも注意。発生は春と夏〜秋の年2回が多い。",s:"ツバキやサザンカの葉っぱ、最近触って「かゆく」なりませんでした？"},
{c:"虫と病気",t:"イラガは「電気虫」",b:"サクラやカキなどにつくイラガの幼虫は、触れると電気が走ったような痛みがあり「電気虫」と呼ばれる。",s:"「電気虫」って聞いたことあります？見つけても触らないでくださいね。"},
{c:"虫と病気",t:"アメリカシロヒトリは外来種",b:"戦後に北アメリカから入ったと言われるガで、サクラなどの葉を食べる。年2〜3回発生し、若い幼虫が巣網に集まっているうちに枝ごと取ると効率的。",s:"桜の葉っぱに白い網の巣がついていたこと、ありませんか？"},
{c:"虫と病気",t:"松枯れの正体",b:"マツノザイセンチュウという小さな線虫が、マツノマダラカミキリに運ばれてマツに入り、木を枯らす。幹に薬を注入して予防する。",s:"松が赤く枯れているの、山で見かけたことありませんか？"},
{c:"虫と病気",t:"ナラ枯れ",b:"カシノナガキクイムシという小さな甲虫が菌を運び、ナラやカシ類を枯らす。夏に急に葉が赤茶色になって枯れるのが特徴。",s:"山のドングリの木が、夏なのに茶色く枯れているのを見たことは？"},
{c:"虫と病気",t:"すす病はアブラムシから",b:"葉が黒いすすをかぶったようになるすす病は、アブラムシやカイガラムシの排せつ物にカビが生えて起こる。原因の虫を退治するのが近道。",s:"葉っぱが黒くすすけたようになっていませんか？原因は別の所にあるんです。"},
{c:"虫と病気",t:"スズメバチは黒を狙う",b:"スズメバチは黒いものに向かってくる性質がある。巣の近くで作業するときは白っぽい服と帽子を選ぶ。秋は特に攻撃的になる。",s:"ハチの巣の近くに行くとき、何色の服を着ています？"},
{c:"虫と病気",t:"ウルシの仲間に注意",b:"ハゼノキやヤマウルシなど、ウルシの仲間は触れるとかぶれることがある。秋に真っ赤に紅葉するので、知らずに触る人も多い。",s:"秋に真っ赤になるきれいな葉っぱ、触ると危ない木があるんですよ。"},
{c:"虫と病気",t:"毒のある庭木",b:"キョウチクトウ・アセビ・レンゲツツジなどは毒を持つ。キョウチクトウは燃やした煙も有害とされるので、剪定枝を燃やさない。",s:"お庭の木の中に、毒がある木があるってご存じですか？"},
{c:"虫と病気",t:"葉水でハダニ予防",b:"ハダニは高温で乾燥した時期に増える。葉の裏に水をかける「葉水（はみず）」で発生を抑えられる。",s:"葉っぱの裏に水をかけるだけで、防げる虫がいるんですよ。"},
{c:"虫と病気",t:"うどんこ病",b:"葉に白い粉をまいたようなカビが生える病気。風通しが悪いと出やすいので、透かし剪定が予防になる。",s:"葉っぱに白い粉がついたようになっていませんか？"},
// ───────── 話のタネ（数字・豆知識）
{c:"話のタネ",t:"桜は咲いて約1週間で満開",b:"ソメイヨシノは開花から満開まで約1週間、満開から散るまでも約1週間と言われる。",s:"桜って、咲き始めてから何日くらいで満開になると思います？"},
{c:"話のタネ",t:"木陰は涼しい",b:"木の葉は水を蒸発させて熱を奪い、日差しもさえぎる。夏の木陰は、日なたより体感でかなり涼しくなる。",s:"夏、木陰に入ると涼しいのはなぜだと思います？"},
{c:"話のタネ",t:"愛媛の県の木はマツ",b:"愛媛県の木はマツ、県の花はミカンの花。松山という地名にも松が入っている。",s:"愛媛の「県の木」、何かご存じですか？"},
{c:"話のタネ",t:"庭木は「本」と「株」",b:"1本立ちの木は「本」、根元から何本も幹が出る株立ちの木は「株」で数える。",s:"木を数えるとき、「本」と「株」を使い分けるんですよ。"},
{c:"話のタネ",t:"シンボルツリー",b:"家の顔になる1本のこと。人気はシマトネリコ・ヤマボウシ・ハナミズキ・オリーブ・ソヨゴなど。成長の早さと最終的な大きさで選ぶのが大事。",s:"家の顔になる「シンボルツリー」、何を植えるか迷われていますか？"},
{c:"話のタネ",t:"シマトネリコはよく伸びる",b:"シマトネリコは人気の庭木だが成長が早く、放っておくと数年で2階に届く。毎年の剪定で高さを抑えるのが前提の木。",s:"シマトネリコ、植えたときより随分大きくなっていませんか？"},
{c:"話のタネ",t:"果樹は「受粉樹」が必要なことも",b:"ブルーベリーやキウイ、一部の梅やすももは、別の品種や雄の木が近くにないと実がつきにくい。",s:"実のなる木を植えたのに、実がつかないってことありません？"},
{c:"話のタネ",t:"庭の雑草は「根から」",b:"雑草は地上だけ刈っても根が残ると、すぐまた生える。雨上がりの土がやわらかい時に根から抜くと楽。",s:"草むしり、何かコツがあると楽ですよね。"},
{c:"話のタネ",t:"苔むす庭",b:"苔は日陰と湿り気、それに水はけの良さを好む。強い日差しと乾燥、水たまりが苦手。",s:"苔がきれいに育つ場所と育たない場所、何が違うと思います？"},
{c:"話のタネ",t:"花が咲かない理由の多くは剪定時期",b:"「花が咲かなくなった」という相談の多くは、花芽ができた後に剪定してしまったことが原因。木ごとに花芽をつくる時期を知ることが大切。",s:"「最近花が咲かなくなった」って木はありませんか？"},
{c:"話のタネ",t:"植えてすぐは水が命",b:"植え付けや植え替え直後は、根がまだ十分に張っておらず水を吸う力が弱い。最初の夏は特に水切れに注意する。",s:"植えたばかりの木、水やりはどのくらいしていますか？"},
// ───────── 追加（2026-10-25）縁起・名前
{c:"縁起・名前",t:"金のなる木",b:"「金のなる木」と呼ばれる多肉植物はカネノナルキ（クラッスラ）。硬貨の穴を新芽に通して育てると、お金が貯まる縁起物とされた。",s:"「金のなる木」、お家にあったりしません？"},
{c:"縁起・名前",t:"門松の松と竹",b:"門松は年神様を迎える目印。松は神が宿る木とされ、竹の切り口を斜めにした「そぎ」の形は、江戸時代以降に広まったと言われる。",s:"門松の竹、なぜ斜めに切ってあるかご存じですか？"},
{c:"縁起・名前",t:"榊（サカキ）の名前",b:"神棚や神事に使うサカキは「神と人の境の木（境木）」から名がついたという説がある。サカキが少ない地域ではヒサカキが代わりに使われる。",s:"神棚のサカキ、名前の意味をご存じですか？"},
{c:"縁起・名前",t:"樒（シキミ）は仏事の木",b:"シキミはお墓や仏壇に供える木。実には強い毒があり、「悪しき実」から名がついたという説もある。",s:"シキミ、お墓に供える木ですが、実は触るとき注意がいるんです。"},
{c:"縁起・名前",t:"桂の木は甘い香り",b:"カツラの葉は秋に黄葉して落ちると、キャラメルや綿菓子のような甘い香りがする。「香出（かづ）」が名の由来という説もある。",s:"秋にこのカツラの木の下で、甘い匂いがしませんでした？"},
{c:"縁起・名前",t:"沈丁花の名前",b:"香りが香木の沈香（じんこう）に、花の形が丁子（ちょうじ）に似ていることから「沈丁花」。",s:"ジンチョウゲの漢字、すごく難しいんですよ。どんな意味だと思います？"},
{c:"縁起・名前",t:"梔子（クチナシ）は「口無し」",b:"熟しても実が割れて口を開かないことから「口無し」になったという説が有名。実は黄色の染料や、栗きんとんの色づけに使われる。",s:"クチナシって、変わった名前ですよね。由来をご存じですか？"},
{c:"縁起・名前",t:"木瓜（ボケ）の名前",b:"実が瓜に似ているので「木瓜（もっけ）」と呼ばれ、それがなまって「ボケ」になったと言われる。",s:"ボケの花、なぜこんな名前になったと思います？"},
{c:"縁起・名前",t:"ミズキの名前",b:"春先に枝を切ると、水のように樹液がしたたることから「水木」。ハナミズキは花の目立つミズキの仲間という意味。",s:"ミズキの「水」って、何のことだと思います？"},
{c:"縁起・名前",t:"ヤツデは天狗の団扇",b:"大きな手のひら形の葉が天狗の持つ団扇に見立てられ、魔除けとして玄関や裏口に植えられてきた。葉の裂け目は「八つ」とは限らず7や9のことが多い。",s:"ヤツデの葉っぱ、何に見えます？玄関に植える理由があるんです。"},
{c:"縁起・名前",t:"アオキは冬も青い木",b:"枝まで青い（緑の）ことから「青木」。日陰でも育ち、冬に赤い実がつくので、北側の庭の彩りになる。",s:"アオキの「青」、どこが青いと思います？"},
{c:"縁起・名前",t:"花水木と「ハナミズキ」の歌",b:"一青窈さんの歌『ハナミズキ』は、アメリカ同時多発テロをきっかけに作られたと本人が語っている。ハナミズキが日米の友好の木であることとも重なる。",s:"『ハナミズキ』の歌、どうしてできたかご存じですか？"},
{c:"縁起・名前",t:"紅葉（もみじ）の語源",b:"秋に草木の色が変わることを「もみつ（もみづ）」と言い、それが「もみじ」になったと言われる。カエデはカエルの手（かえるで）から。",s:"「もみじ」って、もともと動詞だったんですよ。"},
{c:"縁起・名前",t:"欅（ケヤキ）は「けやけき木」",b:"「けやけし」は目立つ、際立つという古い言葉。木目が美しく堅い、際立った木という意味だと言われる。",s:"ケヤキの名前、昔の言葉から来ているんです。"},
{c:"縁起・名前",t:"楠と「子孫繁栄」",b:"クスノキは長生きで大きく育つため、神社のご神木になっていることが多い。全国の巨樹ランキングの上位にも多い。",s:"神社の大きな木、楠が多いのに気づいたことあります？"},
{c:"縁起・名前",t:"松の「緑」は「みどり」",b:"春に伸びる松の新芽のことを、庭師は「みどり」と呼ぶ。色の名前の「みどり」とは別に、新芽そのものを指す。",s:"庭師が松の「みどり」って言うの、何のことだと思います？"},
// ───────── 剪定の知恵
{c:"剪定の知恵",t:"「切り戻し」と「切り詰め」",b:"枝を途中で短くするのが切り詰め、伸びすぎた枝を分かれ目まで戻して切るのが切り戻し。どちらも木を小さく保つための技。",s:"「切り戻し」と「切り詰め」、似ていますけど違うんですよ。"},
{c:"剪定の知恵",t:"まず「上から」切る理由",b:"木の上の方は日がよく当たり勢いが強い。上を先に整えると全体のバランスが見えやすく、下の枝にも光が届く。",s:"木を切るとき、上と下どっちから始めると思います？"},
{c:"剪定の知恵",t:"離れて見るのも仕事",b:"剪定中に何度か木から離れて全体を見る。近くだけ見て切ると、片側だけ刈り込みすぎることがある。",s:"剪定の途中で、ときどき木から離れて見ているの気づきました？"},
{c:"剪定の知恵",t:"「懐」を作る",b:"木の内側に光と風が入る空間を「懐（ふところ）」と呼ぶ。懐が詰まると内側の枝が枯れ、外側だけが葉の、中身がスカスカの木になる。",s:"木の内側に「懐」があると、どうなると思います？"},
{c:"剪定の知恵",t:"夏の剪定は「軽く」",b:"真夏に強く切ると、日差しが急に幹に当たって日焼けしたり、木が弱ったりする。夏は伸びすぎた枝を軽く整える程度にする。",s:"夏に木をばっさり切ると、木が「日焼け」するのご存じですか？"},
{c:"剪定の知恵",t:"芯を止める",b:"木の一番上の幹（芯）を切ると、それ以上の高さには伸びにくくなる。ただし下から新しい芯が立ちやすいので、毎年の確認が必要。",s:"木の高さ、これ以上高くしたくないって思うことありません？"},
{c:"剪定の知恵",t:"ひこばえは早めに",b:"根元から出るひこばえは、放っておくと養分を取られ、本体が弱る。小さいうちに付け根から取るのが楽。",s:"根元から細い枝が生えていませんか？あれは早めに取りたいんです。"},
{c:"剪定の知恵",t:"芽の向きと枝の未来",b:"剪定は「今の枝」ではなく「来年どの芽が伸びるか」を考えて切る。1回の剪定で3年先の形を作るイメージ。",s:"剪定って、実は今年じゃなくて「来年の形」を考えて切っているんです。"},
{c:"剪定の知恵",t:"刈込みと透かしの使い分け",b:"生垣や玉物は表面をそろえる刈込み、自然な樹形の木は枝を抜く透かし。同じ木でも、仕立て方によって切り方が変わる。",s:"この木は表面をそろえて、あの木は枝を抜いて。切り方を変えているの分かります？"},
{c:"剪定の知恵",t:"果樹は「花芽」を残す",b:"ウメ・カキ・ミカンなどの果樹は、どの枝に花芽がつくかを知って切らないと、実がならなくなる。カキは前年に伸びた枝の先の方に花芽がつく。",s:"柿やミカン、去年は実がたくさんなりました？"},
{c:"剪定の知恵",t:"バラは冬に強く、夏に軽く",b:"四季咲きのバラは、冬に強めに切って春の花を、夏の終わりに軽く切って秋の花を楽しむのが一般的。",s:"バラ、いつ切っていますか？冬と夏で切り方が違うんですよ。"},
{c:"剪定の知恵",t:"高さを下げるのは数年かけて",b:"大きくなりすぎた木を一度に半分の高さにすると、弱ったり枯れたりすることがある。2〜3年かけて少しずつ下げるのが安全。",s:"「この木、半分の高さにして」って思ったことありません？"},
{c:"剪定の知恵",t:"道具は消毒する",b:"病気の枝を切った鋏で別の木を切ると、病気がうつることがある。アルコールなどで刃を拭いてから次の木へ移る。",s:"鋏、一本切るたびに拭いているの気づきました？"},
{c:"剪定の知恵",t:"よく切れる鋏は木にやさしい",b:"切れ味の悪い鋏は切り口をつぶし、傷が治りにくくなる。庭師が毎日刃を研ぐのは、木の傷を小さくするため。",s:"よく切れる鋏で切ると、木にとっていいことがあるんです。"},
// ───────── 季節の手入れ
{c:"季節の手入れ",t:"1月：寒肥と冬の剪定",b:"落葉樹の骨格剪定、寒肥、雪吊りの点検など。木が休んでいる時期なので、太い枝の整理に向く。",s:"寒い1月、庭師は何をしていると思います？"},
{c:"季節の手入れ",t:"3月：芽吹きの前に",b:"芽が動き出す前に、落葉樹の剪定を終える。春の植え付けや、芝の目土の準備もこの頃から。",s:"春の芽吹きの前に、済ませておきたい手入れがあるんです。"},
{c:"季節の手入れ",t:"5月：みどり摘みと花後の剪定",b:"松のみどり摘み、ツツジ・サツキの花後の剪定、新芽につく虫の見回りが重なる、庭師の忙しい季節。",s:"5月は庭師がいちばん忙しい時期のひとつなんですよ。"},
{c:"季節の手入れ",t:"6〜7月：生垣の刈込み",b:"春に伸びた新芽が固まる頃に生垣を刈ると、形がきれいに保てる。梅雨の晴れ間に作業することが多い。",s:"梅雨の晴れ間に生垣を刈るのには、理由があるんです。"},
{c:"季節の手入れ",t:"8月：水やりと休憩",b:"真夏は水切れと熱中症に注意。木への大きな手入れは避け、伸びすぎた枝を軽く整える程度にする。",s:"真夏の庭仕事、気をつけていることはありますか？"},
{c:"季節の手入れ",t:"10〜11月：秋の剪定",b:"常緑樹の整枝や生垣の刈込みで、年末をきれいに迎える。松のもみあげもこの頃から始まる。",s:"秋は、年末に向けて庭を整える季節なんです。"},
{c:"季節の手入れ",t:"12月：年末の手入れと冬支度",b:"松の手入れ、落ち葉掃除、寒さに弱い木の防寒（わら巻き・寒冷紗）を行う。年末は庭師の依頼が集中する。",s:"年末になると、庭師の予定がいっぱいになるの、ご存じでした？"},
{c:"季節の手入れ",t:"霜よけ",b:"寒さに弱い植物は、寒冷紗やわらで覆うと霜の害を防げる。夜に晴れて風のない日ほど霜が降りやすい。",s:"寒さに弱い植物、冬はどうされていますか？"},
{c:"季節の手入れ",t:"落ち葉は宝物",b:"落ち葉を集めて積んでおくと、1〜2年で腐葉土になる。庭の土をふかふかにする天然の土壌改良材。",s:"集めた落ち葉、捨てていませんか？もったいないんです。"},
{c:"季節の手入れ",t:"台風の前に",b:"台風の前は、支柱のゆるみ、枯れ枝、植木鉢などを点検する。茂りすぎた木は風を受けやすいので、透かしておくと倒れにくい。",s:"台風の前に、庭で見ておきたい所があるんです。"},
{c:"季節の手入れ",t:"梅雨の後は虫が増える",b:"梅雨明けから夏にかけて、毛虫やアブラムシ、カイガラムシが増えやすい。葉の裏をこまめに見ると早く気づける。",s:"梅雨が明けたら、葉っぱの裏を見てみてください。"},
{c:"季節の手入れ",t:"新芽の赤い木",b:"ベニカナメモチやシャシャンボなど、新芽が赤い木は、刈り込むとまた赤い新芽が出る。刈る時期を工夫すると赤い時期を長く楽しめる。",s:"生垣の赤い新芽、長く楽しむコツがあるんですよ。"},
// ───────── 樹木のふしぎ
{c:"樹木のふしぎ",t:"木は上からではなく先から伸びる",b:"木の幹は、地面に近い場所が上へ持ち上がって伸びるわけではない。枝や幹の先が伸びるので、幹につけた傷の高さは何年たっても変わらない。",s:"幹に昔つけた傷、何年たっても高さが変わらないって知ってました？"},
{c:"樹木のふしぎ",t:"幹の中心は生きていない",b:"太い木の幹の中心（心材）は、水を運ぶ役目を終えた細胞でできている。生きて水や養分を運んでいるのは、皮に近い外側の部分。",s:"太い木の真ん中、実はもう生きていないんですよ。"},
{c:"樹木のふしぎ",t:"皮を一周むくと枯れる",b:"樹皮のすぐ内側に、葉で作った養分を根へ運ぶ通り道がある。皮をぐるりと一周はぐと、根に養分が届かず木が枯れてしまう。",s:"木の皮をぐるっと一周むくと、どうなると思います？"},
{c:"樹木のふしぎ",t:"葉の裏で呼吸する",b:"多くの木は葉の裏に、空気や水蒸気が出入りする小さな穴（気孔）が多い。葉の裏に水をかけるのが虫よけや乾燥対策になるのはそのため。",s:"葉っぱの裏に水をかけると虫よけになる、その理由が面白いんです。"},
{c:"樹木のふしぎ",t:"常緑樹も葉を落とす",b:"冬も緑の常緑樹も、葉が一生ついているわけではない。数年ごとに古い葉を少しずつ落として入れ替えている。春先にクスノキが葉を落とすのが有名。",s:"冬も緑の木、葉っぱは落ちないと思います？"},
{c:"樹木のふしぎ",t:"秋に葉を落とす理由",b:"冬は寒さで水を吸いにくく、葉から水が逃げると枯れてしまう。落葉樹は葉を落として水の出口を閉じ、冬を乗り切る。",s:"秋に葉っぱが落ちるのは、木の冬越しの作戦なんです。"},
{c:"樹木のふしぎ",t:"木の根は空気も吸う",b:"根も呼吸しているので、土が水浸しで空気がないと根腐れする。植え穴の水はけが悪いと、木が育たない原因になる。",s:"木の根っこも、息をしているってご存じですか？"},
{c:"樹木のふしぎ",t:"きのこと木の協力",b:"マツとマツタケのように、菌類と木の根が栄養をやり取りして助け合う関係がある（菌根）。多くの木が菌の助けで養分を吸っている。",s:"松の根元に生えるマツタケ、松とはどんな関係だと思います？"},
{c:"樹木のふしぎ",t:"モミジとカエデは同じ仲間",b:"植物学ではどちらもカエデ属。園芸の世界では、葉の切れ込みが深いものをモミジ、浅いものをカエデと呼び分けることが多い。",s:"モミジとカエデ、何が違うと思います？"},
{c:"樹木のふしぎ",t:"ヒノキとサワラの見分け",b:"葉の裏の白い模様（気孔線）が、ヒノキはY字形、サワラはX字形に見える。葉先もヒノキは丸く、サワラはとがる。",s:"ヒノキとサワラ、葉っぱの裏で見分けられるんですよ。"},
{c:"樹木のふしぎ",t:"スギ花粉の正体",b:"スギは雄花と雌花が同じ木につき、春に雄花から大量の花粉を風に乗せて飛ばす。最近は花粉の少ない品種への植え替えも進んでいる。",s:"春になると困るスギ花粉、どこから飛んでいると思います？"},
{c:"樹木のふしぎ",t:"メタセコイアも生きた化石",b:"メタセコイアは化石で先に見つかり、絶滅したと考えられていたが、1940年代に中国で生きた木が見つかった。",s:"メタセコイア、一度は「絶滅した」と思われていた木なんです。"},
{c:"樹木のふしぎ",t:"冬に葉を落とす針葉樹",b:"針葉樹はふつう常緑だが、カラマツ・メタセコイア・ラクウショウは秋に紅葉して落葉する。",s:"針葉樹なのに、秋に葉っぱを落とす木があるんですよ。"},
{c:"樹木のふしぎ",t:"ラクウショウの「気根」",b:"湿地に生えるラクウショウは、根の一部が地上にこぶのように突き出す（呼吸根）。水の多い場所で根が息をするためと言われる。",s:"池のそばの木の根元に、こぶがポコポコ出ているの見たことあります？"},
{c:"樹木のふしぎ",t:"ツツジの蜜を吸うのは要注意",b:"ツツジの花の蜜を吸う遊びがあるが、レンゲツツジなど毒のある種類もある。子どもが吸わないよう注意が必要。",s:"子どもの頃、ツツジの蜜を吸ったことあります？"},
{c:"樹木のふしぎ",t:"ハナミズキの花はどこ？",b:"白やピンクの花びらに見えるのは総苞（そうほう）という葉の変化したもの。本当の花は真ん中の小さな粒の集まり。",s:"ハナミズキの花びら、実は花じゃないって知ってました？"},
{c:"樹木のふしぎ",t:"オリーブは2本植える",b:"オリーブは自分の花粉では実がつきにくい品種が多い。実を楽しむなら、違う品種を2本以上近くに植える。",s:"オリーブ、実がならないことありません？"},
{c:"樹木のふしぎ",t:"柑橘とアゲハチョウ",b:"ミカンやユズの葉は、アゲハチョウの幼虫の大好物。気づくと葉が丸坊主になることがあるので、春〜秋は見回りを。",s:"ミカンの葉っぱ、虫に食べられていませんか？"},
{c:"樹木のふしぎ",t:"ザクロの実が割れる",b:"ザクロは熟すと実が自然に割れて、中の赤い粒が見える。この姿から、古くから子孫繁栄の象徴とされてきた。",s:"ザクロが割れているの、病気じゃないかと心配されていません？"},
{c:"樹木のふしぎ",t:"柿の葉茶と柿の葉寿司",b:"柿の葉にはビタミンCが多く、お茶にされる。奈良の柿の葉寿司は、葉の殺菌作用を生かした保存の知恵とも言われる。",s:"柿は実だけじゃなく、葉っぱもお茶や料理に使えるんですよ。"},
{c:"樹木のふしぎ",t:"梅の実の青いうちは生で食べない",b:"青い梅の実や種には、体内で毒に変わる成分が含まれる。梅干しや梅酒に加工すると、その成分は減っていく。",s:"梅の実、青いうちは気をつけてくださいね。"},
{c:"樹木のふしぎ",t:"木の寿命はさまざま",b:"ソメイヨシノは手入れ次第だが60〜80年がひとつの目安と言われ、エドヒガンやヤマザクラには樹齢千年を超えるものもある。",s:"桜って、何年くらい生きると思います？"},
{c:"樹木のふしぎ",t:"日本三大桜",b:"三春滝桜（福島）、山高神代桜（山梨）、根尾谷淡墨桜（岐阜）。いずれも樹齢千年を超えると言われる古木。",s:"日本三大桜、どこにあるかご存じですか？"},
{c:"樹木のふしぎ",t:"冬桜と十月桜",b:"秋から冬にかけて咲く桜もある。ジュウガツザクラやフユザクラは、春と秋〜冬の2回花を咲かせる。",s:"秋や冬に咲く桜があるの、ご存じですか？"},
{c:"樹木のふしぎ",t:"河津桜は早咲き",b:"静岡県河津町で見つかった河津桜は、2月頃から咲く早咲きの桜。ソメイヨシノより濃いピンク色。",s:"河津桜、普通の桜と何が違うかご存じですか？"},
{c:"樹木のふしぎ",t:"花と葉が一緒に出る桜",b:"ヤマザクラは花と同時に赤っぽい若葉が出る。ソメイヨシノは花が先に咲き、葉は後から出るので、花だけが目立つ。",s:"桜の花と葉っぱ、どっちが先に出ると思います？"},
{c:"樹木のふしぎ",t:"木の「こぶ」",b:"幹のこぶは、傷を治そうとして組織が盛り上がったものや、病気・虫によるものなどさまざま。木目が複雑で、工芸品に珍重されることもある。",s:"幹のこぶ、どうしてできると思います？"},
{c:"樹木のふしぎ",t:"苔は根で水を吸わない",b:"苔には本当の根がなく、体の表面全体から水を吸う。根のように見える仮根は、体を支えるためのもの。",s:"苔って、根っこから水を吸っていると思います？"},
// ───────── 庭の歴史・文化
{c:"庭の歴史・文化",t:"日本最古の庭の本",b:"平安時代の『作庭記』は、日本最古の庭づくりの本とされる。石の立て方や池の作り方、してはいけないことなどが書かれている。",s:"日本でいちばん古い庭づくりの本、いつの時代のものだと思います？"},
{c:"庭の歴史・文化",t:"夢窓疎石",b:"鎌倉時代末〜南北朝時代の禅僧で、西芳寺（苔寺）や天龍寺の庭に関わったとされる。禅の庭の基礎を作った人物と言われる。",s:"苔寺や天龍寺の庭を作った、有名なお坊さんがいるんです。"},
{c:"庭の歴史・文化",t:"小堀遠州",b:"江戸時代初期の大名で茶人。桂離宮や南禅寺金地院の庭などに関わったとされ、「遠州好み」と呼ばれる明るく端正な作風を残した。",s:"桂離宮の庭に関わったと言われる、すごい大名がいるんですよ。"},
{c:"庭の歴史・文化",t:"桂離宮",b:"京都にある江戸時代初期の宮家の別荘。池の周りを歩きながら景色の変化を楽しむ回遊式庭園の代表で、ドイツの建築家ブルーノ・タウトが絶賛したことでも知られる。",s:"桂離宮、外国の建築家が大絶賛した庭なんですよ。"},
{c:"庭の歴史・文化",t:"金閣寺と銀閣寺",b:"金閣（鹿苑寺）は室町幕府3代将軍の足利義満、銀閣（慈照寺）は8代将軍の足利義政が建てた。銀閣には銀は貼られていない。",s:"銀閣寺って、銀が貼られていると思います？"},
{c:"庭の歴史・文化",t:"銀沙灘と向月台",b:"銀閣寺の庭には、白砂を波のように盛った「銀沙灘」と、円すい形に盛った「向月台」がある。月の光を映すためとも言われる。",s:"銀閣寺の庭にある、白い砂の山を見たことありますか？"},
{c:"庭の歴史・文化",t:"後楽園の名前",b:"「天下の憂いに先立って憂い、天下の楽しみに後れて楽しむ」という中国の言葉から。岡山の後楽園も、東京の小石川後楽園も同じ由来。",s:"「後楽園」の名前の意味、ご存じですか？"},
{c:"庭の歴史・文化",t:"偕楽園は「皆で楽しむ」",b:"水戸藩主の徳川斉昭が、領民と「偕（とも）に楽しむ」ために造り、開放した。梅の名所として知られる。",s:"水戸の偕楽園、名前にどんな願いが込められていると思います？"},
{c:"庭の歴史・文化",t:"栗林公園",b:"香川県高松市の大名庭園で、国の特別名勝。紫雲山を背景にした広大な回遊式庭園で、四国を代表する庭。",s:"香川の栗林公園、行かれたことありますか？"},
{c:"庭の歴史・文化",t:"愛媛の庭園",b:"松山の道後公園は湯築城の跡、宇和島には伊達家ゆかりの天赦園がある。天赦園は藤の名所として知られる。",s:"愛媛にも、見ごたえのある庭園があるんですよ。"},
{c:"庭の歴史・文化",t:"西洋の庭の3つの型",b:"イタリアは斜面を段々にした露壇式、フランスは平らな土地に左右対称の平面幾何学式、イギリスは自然の風景を写した風景式が代表。",s:"西洋の庭にも、国ごとに型があるんです。"},
{c:"庭の歴史・文化",t:"ヴェルサイユ宮殿の庭",b:"ル・ノートルが設計した、フランス平面幾何学式庭園の代表。まっすぐな並木道と刈り込み、噴水が左右対称に並ぶ。",s:"ヴェルサイユ宮殿の庭、どんな庭かご存じですか？"},
{c:"庭の歴史・文化",t:"露地（茶庭）",b:"茶室へ向かう通路としての庭。飛石・蹲踞・石灯籠などで、日常から茶の世界へ気持ちを切り替える演出がされている。",s:"茶室までの庭には、気持ちを切り替える工夫があるんです。"},
{c:"庭の歴史・文化",t:"関守石",b:"縄で十字に結んだ小さな石を飛石の上に置くと、「ここから先は入らないで」という合図になる。茶庭の作法のひとつ。",s:"飛石の上に、縄で結んだ小さな石が置いてあるの見たことあります？"},
{c:"庭の歴史・文化",t:"打ち水",b:"玄関先や庭に水をまいて、ほこりを抑え、涼しさを呼ぶ習慣。お客さんを迎える前の打ち水は、おもてなしの心とされる。",s:"夏の打ち水、最近されていますか？"},
{c:"庭の歴史・文化",t:"坪庭",b:"町家の建物に囲まれた小さな庭。光と風を家の奥まで取り込み、季節を感じさせる役目がある。",s:"町家の小さな坪庭、どんな役目があると思います？"},
{c:"庭の歴史・文化",t:"鶴亀の庭",b:"鶴島と亀島を石組みで表し、長寿を願う庭。南禅寺金地院の鶴亀の庭が有名。",s:"鶴と亀を石で表した庭があるの、ご存じですか？"},
{c:"庭の歴史・文化",t:"須弥山と三尊石",b:"仏教の世界の中心にある須弥山（しゅみせん）や、仏像の三尊を石組みで表す手法がある。大きな石の左右に小さな石を置くのが三尊石組。",s:"大きな石の左右に小さな石。この並べ方には意味があるんです。"},
{c:"庭の歴史・文化",t:"日本の公園の始まり",b:"明治6年（1873年）の太政官布達によって、上野・浅草・芝などの名所が日本で最初の公園に指定された。",s:"日本で最初の「公園」、いつできたと思います？"},
{c:"庭の歴史・文化",t:"お花見の始まり",b:"奈良時代の花見は梅が中心だったと言われ、平安時代から桜の花見が広まった。庶民の花見が盛んになったのは江戸時代。",s:"昔の人のお花見、最初は桜じゃなかったんですよ。"},
// ───────── 石・竹・道具
{c:"石・竹・道具",t:"灯籠の部位",b:"上から宝珠・笠・火袋・中台・竿・基礎。火袋に灯りをともす。竿のない雪見灯籠、竿を地面に埋める織部灯籠など形もさまざま。",s:"石灯籠の部分、それぞれ名前があるのご存じですか？"},
{c:"石・竹・道具",t:"雪見灯籠",b:"笠が大きく、脚で支える背の低い灯籠。水辺に置かれることが多く、笠に積もる雪を眺めるとも言われる。",s:"池のそばの低い灯籠、何を眺めるためのものだと思います？"},
{c:"石・竹・道具",t:"織部灯籠",b:"竿を直接地面に埋め込む灯籠。茶人の古田織部の名がつき、キリシタン灯籠と呼ばれることもある（諸説あり）。",s:"脚が地面に埋まった灯籠、別の名前で呼ばれることもあるんです。"},
{c:"石・竹・道具",t:"延段",b:"自然石や切石を敷き詰めた園路。真・行・草の格があり、切石だけの「真」から自然石の「草」まで雰囲気が変わる。",s:"石を敷き詰めた道にも「格」があるんですよ。"},
{c:"石・竹・道具",t:"沓脱石",b:"縁側から庭へ下りるとき、履物を脱いだり履いたりする大きな石。沓脱石→二番石→三番石と、少しずつ低くして地面につなぐ。",s:"縁側の下の大きな石、名前があるのご存じですか？"},
{c:"石・竹・道具",t:"四つ目垣",b:"竹で四角い目を組んだ、向こうが透けて見える垣。庭の仕切りに使われ、竹垣の基本とされる。",s:"向こうが透けて見える竹垣、竹垣の基本なんです。"},
{c:"石・竹・道具",t:"光悦寺垣",b:"割竹を菱形に組み、上を玉縁で覆った、低く弧を描く垣。牛が寝そべった姿に見えることから「臥牛垣」とも呼ばれる。",s:"弧を描いた低い竹垣、何かの動物に見えませんか？"},
{c:"石・竹・道具",t:"竹垣の寿命",b:"天然の竹垣は、雨風にさらされて数年〜10年ほどで傷んでくる。最近は長持ちする樹脂製の竹垣も多い。",s:"竹垣って、何年くらいもつと思います？"},
{c:"石・竹・道具",t:"庭石の産地名",b:"伊予青石（愛媛）、鞍馬石（京都）、紀州青石（和歌山）など、庭石には産地の名がつく。伊予青石は緑がかった美しい石として知られる。",s:"庭石にも「ブランド」があるんですよ。愛媛にも有名な石があるんです。"},
{c:"石・竹・道具",t:"真砂土",b:"花崗岩が風化してできた砂まじりの土。西日本で多く、水はけがよく、庭や校庭の土としてよく使われる。",s:"西日本の庭によくある砂っぽい土、名前があるんです。"},
{c:"石・竹・道具",t:"赤玉土と鹿沼土",b:"赤玉土は関東の赤土を粒にしたもので、鉢植えの基本の土。鹿沼土は栃木県鹿沼産の軽石質の土で、酸性を好むサツキなどに使う。",s:"園芸の土、赤玉土と鹿沼土の違いご存じですか？"},
{c:"石・竹・道具",t:"地下足袋",b:"足袋の底にゴムをつけた作業用の履物で、大正時代に広まった。足の裏で地面を感じられ、脚立や木の上で滑りにくい。",s:"庭師の地下足袋、なぜ長靴じゃないと思います？"},
{c:"石・竹・道具",t:"刈込鋏と植木鋏",b:"刈込鋏は両手で持つ長い刃のはさみで、生垣の表面をそろえる。植木鋏は輪の持ち手のはさみで、細かい枝や葉を一本ずつ切る。",s:"庭師の鋏、何種類使い分けているか分かります？"},
{c:"石・竹・道具",t:"砥石で研ぐ",b:"鋏の刃は砥石で研ぐ。荒砥・中砥・仕上げ砥と順に細かくしていくと、切れ味が長持ちする。",s:"鋏を研ぐ砥石、何種類も使うんですよ。"},
{c:"石・竹・道具",t:"支柱の種類",b:"若い木を1本の棒で支える添え柱、2本で支える鳥居型、3〜4本で斜めに支える八つ掛など、木の大きさで支柱を使い分ける。",s:"植えたばかりの木の支え、形がいろいろあるの気づきました？"},
{c:"石・竹・道具",t:"杉皮で幹を守る",b:"支柱を結ぶとき、幹に直接縄をかけず杉皮などを巻いて保護する。幹に縄が食い込むのを防ぐため。",s:"支柱を結ぶとき、幹に何か巻いてあるの気づきました？"},
// ───────── 虫と病気
{c:"虫と病気",t:"カイガラムシは冬に退治",b:"カイガラムシは殻に守られて薬が効きにくい。冬に木が休んでいる間にマシン油乳剤をまくか、ブラシでこすり落とす。",s:"枝に白いつぶつぶがついていませんか？退治するなら冬なんです。"},
{c:"虫と病気",t:"アブラムシとアリ",b:"アブラムシの出す甘い汁を求めてアリが集まり、アリはアブラムシを天敵のテントウムシから守る。アリが木を上り下りしていたらアブラムシのサイン。",s:"木にアリがたくさん上っていたら、要注意なんですよ。"},
{c:"虫と病気",t:"テントウムシは味方",b:"ナナホシテントウなどは幼虫も成虫もアブラムシを食べる益虫。薬をまく前に、天敵がいるか見てみるのも手。",s:"テントウムシ、見つけたら大事にしてくださいね。"},
{c:"虫と病気",t:"カマキリやクモも味方",b:"カマキリやクモ、鳥は、庭の虫を食べてくれる。薬を使いすぎると、こうした味方まで減ってしまう。",s:"庭のカマキリやクモ、追い払っていませんか？"},
{c:"虫と病気",t:"赤星病とビャクシン",b:"ナシやボケの赤星病は、カイズカイブキなどビャクシンの仲間を行き来して広がる。両方が近くにあると発生しやすい。",s:"ナシやボケの葉っぱに、赤い点が出ていませんか？"},
{c:"虫と病気",t:"てんぐ巣病",b:"サクラの枝の一部から細い枝がほうきのように密集して出る病気。花が咲かず、冬に病気の枝を切って処分する。",s:"桜の枝に、ほうきみたいな枝の塊がありませんか？"},
{c:"虫と病気",t:"カミキリムシの穴",b:"幹の根元に木くず（フラス）が出ていたら、カミキリムシの幼虫が中を食べているサイン。放っておくと木が弱り、折れることもある。",s:"木の根元に木くずが落ちていませんか？"},
{c:"虫と病気",t:"毛虫に刺されたら",b:"チャドクガなどの毒毛に触れたら、こすらずにガムテープなどで毛を取り、流水で洗う。ひどい時は皮膚科へ。",s:"毛虫の毛に触ったら、どうしています？"},
{c:"虫と病気",t:"薬は風上から",b:"薬剤をまく時は、自分にかからないよう風を背に受けてまく。風の強い日や、近所の洗濯物がある時は避ける。",s:"薬をまくとき、風の向きを気にしていますか？"},
{c:"虫と病気",t:"薬の薄め方",b:"1000倍に薄めるなら、水1Lに薬1mL。10Lなら10mL。濃くしても効き目は上がらず、葉が傷む（薬害）ことがある。",s:"薬の「1000倍」って、どのくらい薄めるか分かります？"},
{c:"虫と病気",t:"マダニに注意",b:"草むらや藪での作業では、マダニにかまれることがある。長袖・長ズボンで肌を出さず、作業後は体を確認する。",s:"草むらで作業したあと、体を確認していますか？"},
// ───────── 話のタネ
{c:"話のタネ",t:"庭木の高さの測り方",b:"樹高は地面から葉の茂りの一番上まで。飛び出した1本の徒長枝は含めない。",s:"木の高さを測るとき、どこからどこまでだと思います？"},
{c:"話のタネ",t:"幹周は1.2mで測る",b:"木の太さ（幹周）は、地面から1.2mの高さで幹の周りを測る。株立ちは各幹を足して70%を目安にする。",s:"木の太さ、どの高さで測るかご存じですか？"},
{c:"話のタネ",t:"「H・C・W」",b:"植木の規格表では、H＝樹高、C＝幹周、W＝枝張（葉張）。見積もりや図面に出てくる記号。",s:"見積もりの「H・C・W」、何の記号か分かります？"},
{c:"話のタネ",t:"苗木から庭木になるまで",b:"庭木として出荷される木は、畑で何年もかけて育てられ、根回しや剪定を重ねている。大きい木ほど年数がかかり、値段も上がる。",s:"庭木って、畑で何年くらい育ててから届くと思います？"},
{c:"話のタネ",t:"植木の値段は高さで変わる",b:"同じ樹種でも、高さや形のよさ、仕立てにかかった手間で値段が大きく変わる。仕立て物の松などは特に高価。",s:"同じ松でも、値段がすごく違うことがあるんですよ。"},
{c:"話のタネ",t:"屋上緑化と壁面緑化",b:"建物の屋上や壁を植物で覆うと、夏の室温上昇を抑えられる。屋上は土と水の重さに建物が耐えられるかの確認が必要。",s:"ビルの屋上や壁に植物を植えるの、見たことありますか？"},
{c:"話のタネ",t:"緑のカーテン",b:"ゴーヤやアサガオを窓の外に育てると、日差しをさえぎり、葉からの蒸散で周りを涼しくする。",s:"窓の外のゴーヤ、夏に涼しくなるのはなぜだと思います？"},
{c:"話のタネ",t:"雑草を防ぐ方法",b:"防草シートの上に砂利を敷く、地被植物で地面を覆う、マルチングするなどの方法がある。完全になくすより「生えにくくする」のが現実的。",s:"雑草、ゼロにするのは大変ですよね。現実的な方法があるんです。"},
{c:"話のタネ",t:"グランドカバー",b:"タマリュウ、クラピア、芝などで地面を覆うと、雑草を抑え、土ぼこりや泥はねも防げる。",s:"地面を植物で覆うと、雑草のほかにもいいことがあるんです。"},
{c:"話のタネ",t:"庭木は隣の家に注意",b:"越境した枝は、民法の改正（2023年4月施行）で、一定の条件のもと隣の人が切れる場合ができた。トラブルになる前に、境界際の木は早めに手入れを。",s:"お隣にはみ出した枝、最近ルールが変わったのご存じですか？"},
{c:"話のタネ",t:"落ち葉と雨どい",b:"落葉樹の近くの家では、雨どいに落ち葉が詰まりやすい。秋の終わりの掃除で、雨漏りや水あふれを防げる。",s:"秋の終わりに、雨どいを見たことありますか？"},
{c:"話のタネ",t:"庭木と防犯",b:"背の高い生垣や茂りすぎた木は、外からの視線をさえぎる反面、侵入者の隠れ場所になることもある。見通しのよい高さに保つのも防犯対策。",s:"背の高い生垣、防犯の面ではどうだと思います？"},
{c:"話のタネ",t:"ガーデニングは健康に良い",b:"庭仕事は体を動かし、日光を浴び、植物の緑に触れるので、気分転換や運動になると言われる。",s:"庭仕事をしたあと、気分がすっきりしませんか？"},
{c:"話のタネ",t:"鳥を呼ぶ庭",b:"ナンテン・センリョウ・ピラカンサなど赤い実の木は、冬に鳥が食べに来る。メジロにはミカンを半分に切って枝に刺すと来やすい。",s:"冬に鳥が遊びに来る庭にしたいと思ったことありません？"},
{c:"話のタネ",t:"紅葉の見ごろ",b:"紅葉は北や山から始まり、1日に数十kmの速さで南下すると言われる。平地では11月下旬〜12月上旬が見ごろの地域が多い。",s:"紅葉前線、1日にどのくらい進むと思います？"},
{c:"話のタネ",t:"「雑木の庭」",b:"コナラ・クヌギ・ヤマボウシなど、雑木林にあるような木を自然な形で植える庭。四季の変化が楽しめ、近年人気がある。",s:"最近人気の「雑木の庭」、どんな庭かご存じですか？"},
{c:"話のタネ",t:"庭に池をつくるなら",b:"池は水の循環や落ち葉の掃除、蚊の対策などの手入れが必要。メダカを入れるとボウフラを食べてくれる。",s:"庭に池を作りたいと思ったこと、ありますか？"},
];

// 秘伝の巻物：ランクが上がるたびに鬼松老師から1本授かる（r = RANKS の番号）
// 低いランクは道具と基本、真ん中は木の読み方と現場、上のランクは仕事・お客さん・独立の心得
window.SCROLLS = [
{r:0,t:"入門の巻 ― 鋏は手の延長",b:"植木鋏は、輪に指を深く入れず、親指と人差し指・中指で軽く支える。握りしめると細かい動きができず、手も早く疲れる。切るときは刃の根元近くで切ると力が少なくて済み、刃先で切ると細い枝を正確に切れる。",p:["握りしめず、指で支える","太い枝は刃の根元、細かい所は刃先","切った枝はすぐ落とし、手元を見やすく"]},
{r:1,t:"素人の巻 ― 道具の手入れ",b:"仕事の終わりに、刃についた樹液とヤニを拭き取り、油をひく。ヤニが固まると切れ味が落ち、さびの原因になる。切れない鋏は枝の切り口をつぶし、木の傷を大きくする。道具の手入れは、木の手入れの一部。",p:["樹液とヤニはその日のうちに拭く","刃に薄く油をひいてさびを防ぐ","切れ味が落ちたら、無理せず研ぐ"]},
{r:2,t:"見習いの巻 ― 安全は段取りから",b:"脚立は、開き止めを確実にかけ、地面の固い所に立てる。天板には乗らない。作業の前に、電線・ハチの巣・足元の段差を見て回るだけで、事故はぐっと減る。急ぐ日ほど、最初の一周の見回りを省かない。",p:["脚立は固い地面に、開き止めをかける","作業前に電線・ハチの巣・段差を一周見る","急ぐ日ほど見回りを省かない"]},
{r:3,t:"凡人の巻 ― 掃除が仕事の半分",b:"剪定がうまくても、帰ったあとに葉が一枚残っていれば、お客さんの記憶に残るのはその一枚。切る前にブルーシートを敷き、切りながら集め、最後に樋や植え込みの中まで見る。掃除の丁寧さは、仕事全体の印象を決める。",p:["切る前にシートを敷く","切りながら集めると最後が楽","樋・植え込みの中・隣の敷地まで見る"]},
{r:4,t:"半人前の巻 ― 枝を読む",b:"切る前に、木の前に立ってしばらく眺める。どの枝が幹から勢いよく伸び、どの枝が弱っているか。混んでいる所はどこか。忌み枝を見つけ、残す枝を先に決めてから鋏を入れると、迷いが減る。",p:["切る前に眺める時間をとる","残す枝を先に決める","迷ったら切らない。切った枝は戻らない"]},
{r:5,t:"一人前の巻 ― 樹種ごとの「くせ」",b:"同じ切り方でも、木によって反応が違う。サクラは切り口が弱い。ツバキやサザンカは強く切っても芽が出やすい。マツは芽の出る場所が限られる。木ごとのくせを覚えると、切っていい所と、いけない所が見えてくる。",p:["サクラは太枝を切らない","花木は花芽の時期を知ってから切る","マツは古い枝から芽が出にくい"]},
{r:6,t:"腕利きの巻 ― 三年先を切る",b:"今年の見た目だけで切ると、来年は暴れる。強く切った所からは勢いのいい枝が出る。今年は軽く、来年もう一段。木の形は、数年かけて作るもの。お客さんにも「三年でこの形にします」と伝えると、信頼が生まれる。",p:["強く切った所ほど、来年よく伸びる","大きな形の変更は数年かける","目指す形を言葉にしてお客さんと共有する"]},
{r:7,t:"職人の巻 ― 見積もりの考え方",b:"見積もりは、木の本数と高さ、作業の難しさ、処分する枝葉の量、人数と時間から組み立てる。高い木や電線の近くは、安全のために人手と時間が増える。何にいくらかかるかを説明できる見積もりは、値段以上の安心を生む。",p:["本数・高さ・難しさ・処分量・人と時間","危険な作業は、その分の手間を正直に入れる","内訳を説明できる見積もりにする"]},
{r:8,t:"熟練の巻 ― お客さんの言葉を聞く",b:"「さっぱりと」の意味は、人によって全然違う。作業の前に、どのくらい切るか、残したい枝はあるか、実や花を楽しみにしているかを確かめる。迷ったら、一本切って見てもらうのも手。聞く時間は、やり直しの時間より短い。",p:["「さっぱり」の程度を具体的に確かめる","残したい枝・花・実を先に聞く","迷ったら一本切って確認してもらう"]},
{r:9,t:"達人の巻 ― 写真を残す",b:"作業の前と後を、同じ場所・同じ角度から写真に撮る。お客さんへの報告になり、翌年の手入れの記録にもなる。前後の写真は、次のお客さんに仕事を説明する一番の材料にもなる（載せるときは必ず了承を得る）。",p:["前後を同じ角度で撮る","翌年の手入れの記録にする","人に見せるときは必ず了承を得る"]},
{r:10,t:"秀才の巻 ― 年間管理の提案",b:"一度きりの剪定より、季節ごとに少しずつ手入れするほうが、木はきれいに保たれ、費用も読みやすい。春の消毒、初夏の刈込み、秋の剪定、冬の寒肥。年間の予定を一枚にまとめて提案すると、お客さんも庭の一年が見えて安心する。",p:["一度きりより、季節ごとの少しずつ","年間の予定を一枚にまとめる","木にもお客さんにもやさしい提案にする"]},
{r:11,t:"名人の巻 ― 断る勇気",b:"自分の技術や道具で安全にできない仕事、木を傷める注文は、理由を説明して断るか、別の方法を提案する。無理をして事故や枯死を起こせば、信頼はすぐ失われる。「できない」と正直に言える職人のほうが、長く頼られる。",p:["安全にできない仕事は受けない","木を傷める注文には代わりの案を出す","正直さが、長い付き合いをつくる"]},
{r:12,t:"鬼才の巻 ― 現場をまとめる",b:"人を率いる現場では、朝に作業の流れと危険な所を全員で確かめる（ツールボックスミーティング）。誰がどこをやるか、どこで手を止めて確認するかを決めておくと、作業も速く、事故も減る。",p:["朝に流れと危険を全員で確かめる","持ち場と確認の場所を決める","最後の片付けと点検も全員で"]},
{r:13,t:"天才の巻 ― 品質・安全・工程",b:"施工管理の三本柱は、品質（仕上がり）、安全（けがをしない）、工程（期日に間に合う）。どれか一つを優先しすぎると、ほかが崩れる。三つを同時に見渡し、危ない時は安全を最優先にする。",p:["品質・安全・工程を同時に見る","迷ったら安全を最優先","記録を残し、次の現場に生かす"]},
{r:14,t:"博士の巻 ― 人に教える",b:"教えると、自分の分かっていない所がはっきりする。若い人には、やり方だけでなく「なぜそうするか」を伝える。理由が分かった技は、ほかの木にも応用できる。教えることは、自分の技を磨く一番の近道。",p:["やり方より先に「なぜ」を伝える","教えると自分の穴が見える","任せて、見守り、最後に一緒に確かめる"]},
{r:15,t:"賢者の巻 ― 独立の準備",b:"独立は、技術だけでなく準備で決まる。個人で始めるなら、開業から1か月以内に税務署へ開業届を出す。作業中の事故に備える賠償責任保険、道具と車、最初の数か月の生活費。建設業許可は、1件500万円以上の工事を請け負うときに必要になる。",p:["開業届は開業から1か月以内","賠償責任保険は先に入る","数か月分の生活費を確保してから始める"]},
{r:16,t:"仙人の巻 ― 選ばれる理由をつくる",b:"「何でもできます」より「この地域で、松の手入れならこの人」と言われるほうが選ばれる。得意な木、得意な庭、得意な地域を一つ決めて、それを言葉と写真で伝える。紹介してくれたお客さんへのお礼も忘れない。",p:["得意を一つにしぼって伝える","前後の写真と言葉で見せる","紹介への感謝を形にする"]},
{r:17,t:"神の巻 ― 長く続ける",b:"庭師の仕事は体が資本。高い所の作業や重い物は、若いうちから無理をしない段取りを。季節によって忙しさの差が大きいので、年間管理のお客さんを少しずつ増やすと、仕事も収入も安定する。",p:["体を壊さない段取りを習慣に","忙しい季節と暇な季節をならす","年間管理のお客さんを育てる"]},
{r:18,t:"全知全能の巻 ― 誰かの松になれ",b:"三百年、わしは何十人もの職人に手入れされてきた。うまい者も、下手な者もおった。だが覚えておるのは、木の声を聞こうとした者たちじゃ。次はおぬしが、若い者の松になれ。見守り、ときに叱り、育ててやれ。",p:["木の声を聞く","若い者を見守り、育てる","学び続けることに、終わりはない"]},
];

const qPool = (exam, cat) => QUESTIONS.filter(q => q.ex.includes(exam) && (!cat || q.cat === cat));
function priority(rec, d) {
  if (!rec) return 3 + Math.random() * 2;              // 未出題
  const due = rec.due <= d;
  let p = (due ? 2.5 : 0) + (5 - rec.box) * 0.5 + (rec.lastNg ? 1 : 0) + Math.random() * 1.5;
  // 直近に出した問題は後回し（同じ問題が続けて出ないように）：1時間以内は大きく、6時間以内は少し下げる
  if (rec.t) { const ago = Date.now() - rec.t; if (ago < 3600e3) p -= 6; else if (ago < 6 * 3600e3) p -= 2; }
  return p;
}
function pickQuestions(pool, n) {
  const d = today();
  const ranked = pool.map(q => [q, priority(S.items[q.id], d), S.items[q.id]]).sort((a,b) => b[1] - a[1]);
  // 間違えた問題（復習）は1回の3割まで。残りは新しい問題や、そろそろ忘れる問題から
  const maxReview = Math.max(2, Math.round(n * 0.3));
  const review = ranked.filter(x => x[2] && x[2].lastNg).slice(0, maxReview);
  const rest = ranked.filter(x => !review.includes(x)).slice(0, n - review.length);
  return shuffle([...review, ...rest].slice(0, n).map(x => x[0]));
}

}

function startSession(kind, items, title) {
  if (!items.length) { toast(kind === "weak" ? "弱点はありません。見事だ。" : "出題できる問題がありません"); return; }
  session = {kind, title, items, i:0, results:[], combo:0, missRun:0, maxCombo:0, xp:0, bonus:[], medals:[], startRank:rankIdx(S.xp)};
  quiz = {answered:false};
  touchStreak();
  const h = new Date().getHours(); if (h < 6) grantMedal("dawn"); if (h >= 22) grantMedal("night");
  if (kind === "blitz") { session.timeLeft = 60; session.timer = setInterval(blitzTick, 1000); }
  if (kind === "treeexam") { session.timeLeft = 30; session.timer = setInterval(treeTick, 1000); }
  save(); render(); window.scrollTo(0,0);
}
function start(kind, cat) {
  if (kind === "normal") startSession("normal", pickQuestions(qPool(S.exam, cat), SET_SIZE).map(prepareQ), cat || EXAMS.find(e=>e.id===S.exam).long);
  if (kind === "tree") startSession("tree", pickTrees(SET_SIZE).map(t => prepareTree(t)), "樹木判定");
  if (kind === "weak") {
    const qs = shuffle(weakPool().filter(q => q.ex.includes(S.exam))).slice(0, 7).map(prepareQ);
    const ts = shuffle(weakTrees()).slice(0, SET_SIZE - qs.length).map(t => prepareTree(t));
    startSession("weak", shuffle([...qs, ...ts]), "弱点克服");
  }
  if (kind === "blitz") startSession("blitz", shuffle(qPool(S.exam)).map(prepareQ), "一分勝負");
  if (kind === "tool") startSession("tool", shuffle(pickTools(SET_SIZE)).map(prepareTool), "道具判定");
  if (kind === "treeexam") { const n = TREE_EXAM_N[S.exam] || 10; startSession("treeexam", shuffle(treePool()).slice(0, n).map(t => prepareTree(t, 6)), `樹木の判断等試験（${n}本）`); }
  if (kind === "hot") { const pool = qPool(S.exam).filter(q => q.hot); startSession("normal", pickQuestions(pool.length ? pool : qPool(S.exam), SET_SIZE).map(prepareQ), "頻出テーマ稽古"); }
  if (kind === "quick") startSession("quick", shuffle([...pickQuestions(qPool(S.exam), 4).map(prepareQ), ...pickTrees(1).map(t => prepareTree(t))]), "一服稽古");
  if (kind === "mock") { const sp = mockSpec(S.exam), pool = qPool(S.exam);
    const tf = shuffle(pool.filter(q => q.t === "tf")).slice(0, sp.tf), mc = shuffle(pool.filter(q => q.t === "mc")).slice(0, sp.mc);
    startSession("mock", [...tf, ...mc].map(prepareQ), "腕試し ・ " + EXAMS.find(e=>e.id===S.exam).long); }
  if (kind === "season") { const se = seasonNow(); const pool = QUESTIONS.filter(q => q.ex.includes(S.exam) && se.c.includes(q.cat)); startSession("normal", pickQuestions(pool.length ? pool : qPool(S.exam), SET_SIZE).map(prepareQ), "旬の重点 ・ " + se.t); }
}
function blitzTick() {
  if (!session || session.kind !== "blitz") return;
  session.timeLeft--;
  if (session.timeLeft <= 5 && session.timeLeft > 0) SND.tick();
  const bar = $(".timer i"), cl = $(".clock");
  if (bar) { bar.style.width = Math.max(0, session.timeLeft / 60 * 100) + "%"; bar.parentElement.classList.toggle("low", session.timeLeft <= 10); }
  if (cl) cl.textContent = Math.max(0, session.timeLeft);
  if (session.timeLeft <= 0) { clearInterval(session.timer); finishSession(); }
}

// 判断等試験：1本30秒。時間切れは「分からない」扱いで次へ
function treeTick() {
  if (!session || session.kind !== "treeexam" || quiz.result) return;
  if (quiz.answered) return;
  session.timeLeft--;
  if (session.timeLeft <= 5 && session.timeLeft > 0) SND.tick();
  const bar = $(".timer i"), cl = $(".clock");
  if (bar) { bar.style.width = Math.max(0, session.timeLeft / 30 * 100) + "%"; bar.parentElement.classList.toggle("low", session.timeLeft <= 10); }
  if (cl) cl.textContent = Math.max(0, session.timeLeft);
  if (session.timeLeft <= 0) answer(-1, null);
}

function answer(k, btn) {

  const key = it.kind === "tree" ? it.tree.id : it.q.id;
  const rec = store[key] || {n:0, c:0, box:0, due:d};
  rec.t = Date.now();
  const prevBox = rec.box;
  const wasWeak = rec.lastNg || (rec.n > 0 && rec.box <= 1 && session.kind === "weak");
  const firstClear = ok && rec.c === 0;
  rec.n++; if (ok) { rec.c++; rec.box = Math.min(5, rec.box + 1); rec.lastNg = false; } else { rec.box = 0; rec.lastNg = true; }
  rec.due = d + BOX_DAYS[rec.box];

  let gain = 0;
  if (ok) {
    S.stats.correct++; session.missRun = 0;

    S.stats.bestCombo = Math.max(S.stats.bestCombo, session.combo);
    gain = blitz ? 5 : (it.kind === "tree" && !it.tool ? 12 : 10);
    if (it.q && seasonNow().c.includes(it.q.cat)) gain += 3;
    if (!blitz && session.combo >= 3) gain += Math.min(10, (session.combo - 2) * 2);
    if (firstClear && !blitz) gain += 5;

    missionTick("correct", 1);
    if (it.kind === "tree" && !it.tool) { missionTick("tree", 1); const reg = Object.values(S.trees).filter(r => r.c > 0).length; if (reg >= 10) grantMedal("scout"); if (reg >= TREES.length) grantMedal("botanist"); }

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ["#D4AA4F", "#F4E3AE", "#68BE8D", "#839B5C", "#D9532C"];
  const ps = Array.from({length:110}, () => ({x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*0.42, vx:(Math.random()-.5)*11, vy:-Math.random()*13-4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, s:5+Math.random()*7, c:cols[Math.floor(Math.random()*cols.length)], leaf:Math.random() < .5}));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.leaf) { ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s*.45, 0, 0, Math.PI*2); ctx.fill(); } else ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      ctx.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

  else if (a === "sound") { S.sound = !S.sound; save(); render(); if (S.sound) SND.ok(); }

    if (!resetArmed) { resetArmed = true; t.textContent = "本当にリセットする（もう一度押す）"; setTimeout(() => { resetArmed = false; if (t.isConnected) t.textContent = "記録をリセットする"; }, 4000); return; }
    const keep = {exam:S.exam, sound:S.sound}; S = Object.assign(blank(), keep); save(true); resetArmed = false; toast("記録をリセットしました"); render();
  }
});
document.addEventListener("keydown", e => {
  if (!quiz || quiz.result || /INPUT|TEXTAREA/.test(document.activeElement?.tagName) || document.activeElement?.matches?.("figure.ref") || document.querySelector(".lb")) return;
  const it = session?.items[session.i]; if (!it) return;
  if (!quiz.answered) {
    const map = it.kind === "tf" ? {"o":0,"1":0,"x":1,"2":1} : {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
    if (e.key === "?" || e.key === "0") { const b = $("#idk"); if (b) answer(-1, b); return; }
    const k = map[e.key.toLowerCase()]; if (k !== undefined) { const b = document.querySelector(`[data-ans="${k}"]`); if (b) answer(k, b); }
  } else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (session.kind !== "blitz") nextQ(); }
});

// ─────────────────────────── スマホアプリ版だけの機能
const NOTIFY_LINES = [
  ["鬼松老師", "おい、今日の稽古がまだじゃろ。5問だけでええ。"],
  ["鬼松老師", "松は逃げん。じゃが試験日は待ってくれんぞ。"],
  ["鬼松老師", "一服ついでに5問。それが合格への一番の近道じゃ。"],
  ["鬼松老師", "連続稽古を切らすな。今日の1問が明日の自信になる。"],
];
async function scheduleNotify() {
  const LN = NP("LocalNotifications"); if (!LN) return false;
  try { await LN.cancel({notifications:[{id:1}]}); } catch (e) {}
  if (!S.notify.on) return true;
  const [title, body] = kTier() >= 4 ? ["鬼松老師", `${kCall(kTier())}、本日の稽古のお時間でございます…へへ。`] : kPick(NOTIFY_LINES);
  await LN.schedule({notifications:[{id:1, title, body, schedule:{on:{hour:S.notify.h, minute:S.notify.m}, allowWhileIdle:true}}]});
  return true;
}
async function toggleNotify() {
  const LN = NP("LocalNotifications"); if (!LN) return;
  if (!S.notify.on) {
    const p = await LN.requestPermissions().catch(() => ({display:"denied"}));
    if (p.display !== "granted") { toast("通知が許可されていません。スマホの設定から許可してください"); return; }
  }
  S.notify.on = !S.notify.on; save();
  await scheduleNotify().catch(() => {});
  render(); toast(S.notify.on ? `毎日${S.notify.h}:${String(S.notify.m).padStart(2,"0")}に通知します` : "通知を止めました");
}
function initNative() {
  if (!NATIVE) return;
  document.body.classList.add("native");
  NP("StatusBar")?.setStyle?.({style:"DARK"}).catch(() => {});
  NP("StatusBar")?.setBackgroundColor?.({color:"#090D0A"}).catch(() => {});
  scheduleNotify().catch(() => {});
  // 戻るボタン：開いている画面を閉じる → 演習をやめる → 本部へ → アプリを閉じる
  NP("App")?.addListener?.("backButton", () => {
    const ov = document.querySelector(".overlay, .lb, .promo");
    if (ov) { ov.querySelector("[data-close]")?.click(); if (ov.isConnected) ov.remove(); render(); return; }
    if (quiz) { document.querySelector('[data-act="quit"], [data-act="home"]')?.click(); return; }
    if (tab !== "home") { setTab("home"); return; }
    NP("App").minimizeApp?.();
  });
}

render();
connectCloud();
initNative();
unlockScrolls();
if (!S.onboarded && !S.stats.answered && !quiz) setTimeout(() => { if (!document.querySelector(".overlay")) examSheet(true); }, 350);
// Web版（PWA）：一度開けば、ネットがなくても動くようにする
if (!HOSTED && !NATIVE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
