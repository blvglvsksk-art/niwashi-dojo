<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B100D"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="庭師道場">
<title>庭師道場</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#E8EEE6; --surface:#F8FBF6; --sunk:#DDE5DA; --ink:#15211A; --muted:#58695D; --line:#C6D1C4;
  --pine:#2D6A45; --pine-ink:#F4FAF5; --pine-soft:#D3E6D8;
  --brass:#A97C1E; --brass-soft:#F1E3BF; --miss:#BE3D2A; --miss-soft:#F6D9D3;
  --patch:#6F7D4F; --shadow:0 1px 0 rgba(21,33,26,.06),0 6px 18px -8px rgba(21,33,26,.25);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1410; --surface:#161F19; --sunk:#1E2921; --ink:#E3EBE4; --muted:#93A497; --line:#2B3830;
  --pine:#5DB07D; --pine-ink:#0B1A10; --pine-soft:#1D3526;
  --brass:#D8AE50; --brass-soft:#3A301A; --miss:#EF6D57; --miss-soft:#3D1D18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1410; --surface:#161F19; --sunk:#1E2921; --ink:#E3EBE4; --muted:#93A497; --line:#2B3830;
  --pine:#5DB07D; --pine-ink:#0B1A10; --pine-soft:#1D3526;
  --brass:#D8AE50; --brass-soft:#3A301A; --miss:#EF6D57; --miss-soft:#3D1D18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 104px;min-height:100%}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em}
/* 太い見出し書体は画数の多い漢字がつぶれるので、30px未満では本文書体の極太にする */
.disp.sm{font-family:var(--body);font-weight:900;letter-spacing:.04em}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding-block:2px 6px}
.logo{font-family:var(--body);font-weight:900;font-size:17px;letter-spacing:.06em}
.logo small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:700;margin-top:-3px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700}
.sync{font-size:12px;color:var(--muted)}

/* rank card */
.rankcard{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.rankcard::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(216,174,80,.22),transparent 70%)}
.rankcard .rname{font-family:var(--display);font-size:34px;line-height:1.1}
.rankcard .rsub{font-size:13px;opacity:.7;letter-spacing:.08em}
.xpbar{height:10px;border-radius:6px;background:rgba(127,127,127,.3);overflow:hidden;margin-top:10px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#F0CF7A);border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xpmeta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.85}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--brass)}

/* exam selector */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}

/* cta */
.cta{width:100%;padding:18px;border-radius:16px;background:var(--pine);color:var(--pine-ink);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta .big{font-family:var(--display);font-size:24px;line-height:1}
.cta .sm{font-size:13px;opacity:.85}
.cta svg{flex:none}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h3{font-size:15px;display:flex;align-items:center;gap:8px}
.mission{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding-block:8px;border-top:1px dashed var(--line)}
.mission:first-of-type{border-top:0}
.mission .chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center}
.mission.done .chk{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.mission.done .mt{text-decoration:line-through;color:var(--muted)}
.mission .mbar{grid-column:2/4;height:4px;background:var(--sunk);border-radius:3px;overflow:hidden}
.mission .mbar i{display:block;height:100%;background:var(--brass)}
.mt{font-size:15px;font-weight:500}
.mprog{font-size:13px;color:var(--muted)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--pine)}
.mode:active{transform:scale(.97)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted);line-height:1.45}
.mode .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pine-soft);color:var(--pine)}
.mode .badge{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--miss-soft);color:var(--miss)}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--pine)}

/* category list */
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.cat b{font-size:16px}
.cat .cmeta{font-size:13px;color:var(--muted)}
.cat .cbar{grid-column:1/3;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.cat .cbar i{display:block;height:100%}
.cat .pct{font-family:var(--display);font-size:18px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;padding-block:4px 10px}
.xbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.pips{display:flex;gap:4px;flex:1}
.pips i{flex:1;height:8px;border-radius:4px;background:var(--sunk)}
.pips i.ok{background:var(--pine)} .pips i.ng{background:var(--miss)} .pips i.cur{background:var(--brass)}
.combo{font-family:var(--display);color:var(--brass);font-size:15px;min-width:54px;text-align:right}
.combo.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.4)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.qcat{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;padding:2px 9px;border-radius:999px;background:var(--pine-soft);color:var(--pine)}
.qtext{font-size:17px;font-weight:500;line-height:1.75;margin-top:10px}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tf{height:96px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-size:46px;display:grid;place-items:center;transition:transform .1s}
.tf:active{transform:scale(.96)}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choice{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:16px;font-weight:500;transition:transform .1s}
.choice:active{transform:scale(.98)}
.choice .k{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:14px}
.is-ok{border-color:var(--pine)!important;background:var(--pine-soft)!important}
.is-ng{border-color:var(--miss)!important;background:var(--miss-soft)!important}
.dim{opacity:.45}
.locked button{pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.feedback{margin-top:14px;border-radius:16px;padding:14px 16px;border:2px solid;animation:rise .25s ease-out}
.idkbtn{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-weight:900;font-size:15px}
.idkbtn:active{transform:scale(.98)}
.feedback.idk{border-color:var(--brass);background:var(--brass-soft)}
.feedback.idk .fh{color:var(--brass)}
.feedback.ok{border-color:var(--pine);background:var(--pine-soft)}
.feedback.ng{border-color:var(--miss);background:var(--miss-soft)}
.feedback .fh{font-family:var(--body);font-weight:900;font-size:22px;display:flex;align-items:center;gap:10px}
.feedback.ok .fh{color:var(--pine)} .feedback.ng .fh{color:var(--miss)}
.feedback p{margin:6px 0 0;font-size:15px}
.nextbtn{margin-top:12px;width:100%;padding:14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:900;font-size:16px}
@keyframes rise{from{transform:translateY(8px);opacity:.3}}
.xpfloat{position:fixed;font-family:var(--display);color:var(--brass);font-size:24px;pointer-events:none;z-index:60;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 var(--surface)}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.photo{position:relative;border-radius:14px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .swap{position:absolute;right:8px;bottom:8px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700}
.credit{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;word-break:break-all}
.timer{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;flex:1}
.timer i{display:block;height:100%;background:var(--brass);transition:width .25s linear}
.timer.low i{background:var(--miss)}
.clock{font-family:var(--display);font-size:20px;min-width:44px;text-align:right}

/* result */
.result{text-align:center;padding-top:10px}
.score{font-family:var(--display);font-size:64px;line-height:1}
.score small{font-size:24px;color:var(--muted)}
.ledger{text-align:left;margin-top:16px}
.ledger div{display:flex;justify-content:space-between;padding-block:6px;border-bottom:1px dashed var(--line);font-size:15px}
.ledger div b{font-family:var(--display);color:var(--brass);font-weight:400}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{padding:14px;border-radius:12px;font-weight:900;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.review{text-align:left;margin-top:16px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.review summary{font-size:15px;font-weight:500;cursor:pointer}
.review p{font-size:14px;margin:6px 0 0;color:var(--muted)}

/* zukan */
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:480px){.zgrid{grid-template-columns:repeat(4,1fr)}}
.zc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.zc .zi{aspect-ratio:1;background:var(--sunk);position:relative}
.zc .zi img{width:100%;height:100%;object-fit:cover;display:block}
.zc.lock .zi img{filter:grayscale(1) brightness(.35) blur(3px)}
.zc .zn{font-size:13px;font-weight:700;padding:6px 8px 2px}
.zc .zs{font-size:12px;padding:0 8px 7px;color:var(--brass);letter-spacing:.1em}
.zc.lock .zn{color:var(--muted)}
.zc .no{position:absolute;left:6px;top:4px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sheet / overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,12,9,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:rise .25s}
.promo{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,#2a2210,#0b0d09 70%);color:#F4EBD2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.promo .kicker{letter-spacing:.2em;font-size:16px;font-weight:700;color:#D8AE50}
.promo .pname{font-family:var(--display);font-size:64px;line-height:1;animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
.promo .ins{animation:spin .9s ease-out}
.promo p{margin:0;opacity:.8;font-size:15px;max-width:30ch}
.promo button{margin-top:10px;padding:14px 36px;border-radius:999px;background:#D8AE50;color:#1a1408;font-weight:900;font-size:16px}
@keyframes stamp{from{transform:scale(2.4);opacity:0}}
@keyframes spin{from{transform:rotateY(180deg) scale(.4);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* record */
.ladder{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-block:7px;border-bottom:1px solid var(--line)}
.lrow.fut{opacity:.45}
.lrow.cur{background:var(--brass-soft);margin-inline:-14px;padding-inline:14px;border-radius:10px;border-bottom-color:transparent}
.lrow b{font-size:16px}
.lrow .lx{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:24px;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);font-weight:700}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.medal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.medal b{font-size:13px}
.medal span{font-size:12px;color:var(--muted);line-height:1.4}
.medal.off svg{opacity:.25;filter:grayscale(1)}
.medal.off b{color:var(--muted)}

/* essay */
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.aiout{white-space:pre-wrap;font-size:15px}
/* 参考画像 */
.refs{margin-top:10px;display:grid;gap:8px}
.refs.two{grid-template-columns:1fr 1fr}
.ref{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative}
.ref img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunk)}
.ref .dgm{padding:10px 10px 0;color:var(--ink)}
.ref .dgm svg{width:100%;height:auto;display:block}
.ref figcaption{font-size:13px;padding:6px 10px 8px;color:var(--muted);line-height:1.5}
.refs.two figcaption{font-size:12px}
.ref .zoom{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.lb{position:fixed;inset:0;z-index:75;background:rgba(5,8,6,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;animation:fade .2s}
.lb .box{max-width:720px;width:100%;max-height:78%;display:flex;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.lb .dgm{background:#F8FBF6;color:#15211A;border-radius:12px;padding:14px;width:100%;overflow:auto;
  --miss:#BE3D2A;--pine:#2D6A45;--brass:#A97C1E;--pine-soft:#D3E6D8;--miss-soft:#F6D9D3;--brass-soft:#F1E3BF;--sunk:#DDE5DA}
.lb .dgm svg{width:100%;height:auto;display:block}
.lb p{color:#E9EEE3;font-size:15px;max-width:60ch;text-align:center;margin:0}
.lb .credit{color:#8C9B8B;text-align:center}
.lb button{padding:10px 26px;border-radius:999px;background:#E9EEE3;color:#090D0A;font-weight:900}
/* ═══ 作戦司令部（ホーム）：どのテーマでも暗い司令室で統一 ═══ */
body.hq{
  color-scheme:dark;
  --bg:#090D0A; --surface:#10170F; --sunk:#1A2419; --ink:#EEF2EA; --muted:#AAB7A9; --line:#2C3C2C;
  --pine:#6FD39A; --pine-ink:#06140B; --pine-soft:#143020; --brass:#E2B75A; --brass-soft:#352B14;
  --miss:#EF6D57; --miss-soft:#3A1A15; --shadow:0 10px 30px -12px rgba(0,0,0,.9);
  --hud:"Chakra Petch","Zen Kaku Gothic New","Hiragino Sans",sans-serif; --amber:#FFB547; --gold-grad:linear-gradient(180deg,#FFF3C4 0%,#E9BF5F 48%,#A36F17 78%,#F2CF73 100%);
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%,rgba(226,183,90,.13),transparent 60%),
    linear-gradient(rgba(111,211,154,.035) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(111,211,154,.035) 1px,transparent 1px) 0 0/24px 24px,
    #090D0A;
  background-attachment:fixed;
}
body.hq .tabbar{background:rgba(9,13,10,.92);backdrop-filter:blur(8px);border-top-color:#243224}
body.hq .tabbar button[aria-current="page"]{color:var(--brass)}
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--brass);pointer-events:none;opacity:.85}
.hud::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.hud::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.hqbar{display:flex;align-items:center;gap:10px;font-family:var(--hud);font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.hqbar .led{width:8px;height:8px;border-radius:50%;background:var(--pine);box-shadow:0 0 8px var(--pine);animation:blink 2.4s infinite}
.hqbar .led.off{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes blink{0%,70%,100%{opacity:1}80%{opacity:.25}}
.hqtitle{font-family:var(--body);font-weight:900;font-size:15px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
#sync{white-space:nowrap}
@media (max-width:420px){.hqtitle .hqsub{display:none}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:18px;background:linear-gradient(160deg,#141D13,#0B100B 70%);border:1px solid #2B3A28;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px);pointer-events:none}
.radar{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,transparent 0 30%,rgba(111,211,154,.16) 30.5% 31%,transparent 31.5% 55%,rgba(111,211,154,.16) 55.5% 56%,transparent 56.5% 80%,rgba(111,211,154,.22) 80.5% 81.5%,transparent 82%),
             radial-gradient(circle,rgba(226,183,90,.08),transparent 70%)}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(226,183,90,.10) 0 1px,transparent 1.5px 9px);mask:radial-gradient(circle,#000 60%,transparent 72%);-webkit-mask:radial-gradient(circle,#000 60%,transparent 72%)}
.radar .ins{position:relative;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7)) drop-shadow(0 0 14px rgba(226,183,90,.25))}
@keyframes sweep{to{transform:rotate(360deg)}}
.hero .lbl{font-family:var(--hud);font-size:13px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.hero .rk{font-family:var(--display);font-size:44px;line-height:1.05;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.hero .quote{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
/* 鬼松教官 */
.kyokan{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:end;width:100%;padding:12px 14px 0 0;border-radius:18px;background:linear-gradient(160deg,#141D13,#0B100B 70%);border:1px solid #2B3A28;overflow:hidden;text-align:left;color:var(--ink)}
.kyokan img{width:132px;height:auto;margin:0 0 -4px -6px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.7))}
.bubble{position:relative;align-self:center;margin-bottom:12px;padding:10px 13px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);font-size:15px;line-height:1.65;font-weight:500}
.bubble::before{content:"";position:absolute;left:-7px;bottom:22px;width:12px;height:12px;background:inherit;border-left:1px solid;border-bottom:1px solid;border-color:inherit;transform:rotate(45deg)}
.bubble .who{display:block;font-size:12px;font-weight:700;color:var(--brass);margin-bottom:2px}
.ikari .bubble{border-color:var(--miss);background:#2A1411;font-weight:700}
.ikari .bubble .who{color:var(--miss)}
.dere .bubble{border-color:#E889AE;background:#2B1822}
.dere .bubble .who{color:#F3A6C4}
.kyokan.ikari img,.kres.ikari img,.ksay.ikari img{animation:rage .45s 2}
.kyokan.dere img,.kres.dere img,.ksay.dere img,.kyokan.odoroki img,.kres.odoroki img,.ksay.odoroki img{animation:hop .5s 2}
@keyframes rage{20%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(4px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes hop{40%{transform:translateY(-8px)}}
.ksay{display:grid;grid-template-columns:88px 1fr;gap:4px;align-items:center;margin-top:10px}
.ksay img{width:88px;height:auto}
.ksay .bubble{margin:0;font-size:14px}
.kres{display:grid;grid-template-columns:140px 1fr;gap:6px;align-items:center;margin:10px 0 4px;text-align:left}
.kres img{width:140px;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.7))}
.promo .pk{width:160px;height:auto;margin-top:-6px;animation:hop .6s 3}
.promo .pline{font-size:16px;font-weight:700;color:#F3A6C4;max-width:30ch;line-height:1.6}
@media (prefers-reduced-motion: reduce){.kyokan img,.kres img,.ksay img,.promo .pk{animation:none!important}}
.ammo{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:10px}
.ammo i{height:12px;border-radius:2px;background:#1E291D;border:1px solid #2B3A28}
.ammo i.on{background:var(--gold-grad);border-color:#A36F17;box-shadow:0 0 6px rgba(226,183,90,.35)}
.ammo i.next{background:#3A2F16;border-color:var(--brass);animation:blink 1.6s infinite}
.xprow{display:flex;justify-content:space-between;font-family:var(--hud);font-size:13px;margin-top:6px;color:var(--muted);letter-spacing:.06em}
.xprow b{color:var(--brass);font-weight:700}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ro .k{font-family:var(--body);font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.ro .v{font-family:var(--hud);font-size:26px;font-weight:700;line-height:1.1;color:var(--ink)}
.ro .v small{font-size:13px;color:var(--muted);margin-left:2px}
.ops{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.dday{text-align:center;min-width:92px}
.dday .k{font-family:var(--body);font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.dday .v{font-family:var(--hud);font-size:40px;font-weight:700;line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(255,181,71,.35)}
.dday button{font-size:12px;color:var(--muted);text-decoration:underline;margin-top:4px}
.meter{width:100%;max-width:220px;justify-self:center}
.meter svg{display:block;width:100%;height:auto}
.meter .needle{transform-box:view-box;transform-origin:100px 100px;animation:needle 1.3s cubic-bezier(.2,1.5,.4,1)}
@keyframes needle{from{transform:rotate(0deg)}}
.sortie{position:relative;width:100%;border-radius:16px;overflow:hidden;padding:26px 18px 22px;text-align:left;
  background:linear-gradient(160deg,#1E2A17,#10170D);border:2px solid var(--brass);box-shadow:0 0 0 1px #000,0 14px 30px -10px rgba(226,183,90,.35);display:flex;align-items:center;gap:14px;color:var(--ink)}
.sortie::before,.sortie::after{content:"";position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,#E2B75A 18%,#FFF0B8 50%,#E2B75A 82%,transparent)}
.sortie::before{top:8px} .sortie::after{bottom:8px}
@keyframes hazard{to{background-position:25.5px 0}}
.sortie .big{font-family:var(--display);font-size:40px;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sortie .en{font-family:var(--hud);font-size:13px;letter-spacing:.3em;color:var(--brass);font-weight:700}
.sortie .sm{font-size:13px;color:var(--muted)}
.sortie .chev{margin-left:auto;display:flex;gap:2px;color:var(--brass)}
.sortie .chev i{width:12px;height:22px;background:currentColor;clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%);animation:chev 1.2s infinite}
.sortie .chev i:nth-child(2){animation-delay:.2s}.sortie .chev i:nth-child(3){animation-delay:.4s}
@keyframes chev{0%,100%{opacity:.2}40%{opacity:1}}
.sortie:active{transform:scale(.985)}
.sortie.go{animation:go .22s}
@keyframes go{50%{filter:brightness(1.8)}}
.hqrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.subbtn b{font-size:15px;display:block} .subbtn span{font-size:12px;color:var(--muted)}
.subbtn .ic{color:var(--brass)}
.orders{background:linear-gradient(180deg,#141B12,#10160F);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.orders .oh{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:700;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.orders .oh b{font-family:var(--body);letter-spacing:.06em;color:var(--ink);font-size:15px;font-weight:900}
.hanko{width:30px;height:30px;border-radius:50%;border:2px solid var(--miss);color:var(--miss);display:grid;place-items:center;font-family:var(--display);font-size:14px;transform:rotate(-14deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
body.hq .mission{grid-template-columns:30px 1fr auto}
body.hq .mission .chk{width:24px;height:24px;border-radius:4px;border-color:#3A4A38}
.sectitle{font-family:var(--body);font-size:14px;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.sectitle::after{content:"";flex:1;height:1px;background:var(--line)}
body.hq .mode{background:linear-gradient(160deg,#151E14,#0E140D);border-color:#263424}
body.hq .mode .ic{background:#1F2A17;color:var(--brass)}
/* ═══ 全画面共通の司令部UI ═══ */
.tabbar nav{grid-template-columns:repeat(5,1fr)!important;align-items:end}
.tabbar .fab{position:relative;top:-18px;margin:0 auto;width:66px;height:66px;border-radius:50%;padding:0;justify-content:center;gap:0;
  background:radial-gradient(circle at 35% 30%,#FFF1C0,#E2B75A 45%,#9C6B14 100%);color:#1a1408;font-family:var(--body);font-weight:900;font-size:19px;letter-spacing:.04em;
  box-shadow:0 0 0 4px #090D0A,0 0 0 6px rgba(226,183,90,.55),0 10px 24px -6px rgba(226,183,90,.6)}

.tabbar .fab:active{transform:scale(.94)}
.pagebar{display:flex;align-items:center;gap:10px;padding-block:2px 4px}
.pagebar h1{font-family:var(--body);font-size:22px;font-weight:900;letter-spacing:.06em}
.pagebar .en{font-family:var(--hud);font-size:13px;letter-spacing:.18em;color:var(--brass);font-weight:700;display:block;margin-bottom:-2px}
.hotbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--brass);color:#1a1408;margin-left:6px;letter-spacing:.04em}
.nextbtn{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 10px 24px -8px rgba(0,0,0,.8)}
.intel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.intel .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.intel .card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.intel .card .in{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.intel .card b{font-size:15px;line-height:1.35}
.intel .card span{font-size:12px;color:var(--muted);line-height:1.45}
.intel .mo2{font-family:var(--hud);font-size:34px;font-weight:700;color:var(--brass);line-height:1;padding:12px 11px 0}
.kakochart{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.kc{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.kc .tr{position:relative;height:14px;border-radius:4px;background:var(--sunk)}
.kc .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.kc .tr .pl{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.kc b{font-family:var(--hud);font-size:15px;text-align:right}
select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=number]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
body.hq .stat .v,body.hq .pct,body.hq .front .p{font-family:var(--hud);font-weight:700}
/* 合格作戦 */
.plan{display:flex;flex-direction:column;gap:10px}
.plan .cd{display:flex;align-items:baseline;gap:6px}
.plan .cd b{font-family:var(--display);font-size:30px;line-height:1;font-weight:400}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--sunk);overflow:visible;margin-top:4px}
.gauge>i{display:block;height:100%;border-radius:7px;background:var(--pine);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gauge.low>i{background:var(--brass)}
.gauge .ln{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.gauge .lt{position:absolute;top:-20px;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.gmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.verdict{font-weight:900;font-size:14px;padding:2px 9px;border-radius:999px}
.verdict.pass{background:var(--pine-soft);color:var(--pine)} .verdict.not{background:var(--brass-soft);color:var(--brass)}
.ctarow{display:grid;grid-template-columns:1fr auto;gap:10px}
.quick{padding:0 16px;border-radius:16px;background:var(--surface);border:2px solid var(--pine);color:var(--pine);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.quick b{font-family:var(--body);font-weight:900;font-size:18px}
.quick span{font-size:12px;font-weight:700}
.season{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%}
.season .mo{font-family:var(--display);font-size:26px;line-height:1;color:var(--brass);text-align:center;min-width:48px}
.season .mo small{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.todaytree{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;text-align:left;width:100%}
.todaytree img{width:96px;height:96px;object-fit:cover;border-radius:12px;display:block}
.todaytree b{font-size:17px}
.todaytree p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.mode.wide{grid-column:1/3;min-height:0;flex-direction:row;align-items:center;gap:12px}
/* 作戦地図 */
.fronts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.front{position:relative;text-align:left;border-radius:14px;padding:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;min-height:108px;display:flex;flex-direction:column;gap:4px}
.front .occ{position:absolute;left:0;right:0;bottom:0;background:var(--pine-soft);transition:height .6s}
.front>*:not(.occ){position:relative}
.front b{font-size:15px;line-height:1.35}
.front .st{font-size:12px;font-weight:700;color:var(--muted)}
.front .p{font-family:var(--display);font-size:24px;margin-top:auto;line-height:1}
.front.won{border-color:var(--pine)}
.front.won .st{color:var(--pine)}
.front .hot{position:absolute;right:8px;top:8px;font-size:12px;font-weight:900;padding:1px 7px;border-radius:999px;background:var(--brass);color:var(--surface)}
.front .flag{position:absolute;right:10px;bottom:10px;color:var(--pine)}
/* 週間グラフ */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;padding-top:18px;border-bottom:1px solid var(--line)}
.week .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.week .v{font-size:12px;font-weight:700;color:var(--muted)}
.week .bar{width:70%;max-width:28px;background:var(--pine);border-radius:4px 4px 0 0;min-height:0}
.week .bar.zero{height:2px!important;background:var(--line)}
.week .bar.today{background:var(--brass)}
.wlab{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.jackpot{display:inline-block;font-family:var(--display);color:var(--surface);background:var(--brass);padding:4px 14px;border-radius:999px;font-size:16px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:90;animation:rise .2s;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.linkbtn{color:var(--pine);font-weight:700;font-size:14px;text-decoration:underline}

/* ═════════════════════════════════════════════════════════════
   庭師道場 デザインシステム v1「夜の庭 ― 墨と苔と金」
   仕様書：docs/design-system.html
   ・色は和色（和色大辞典）から：墨緑の背景／若竹色の正解／金色・山吹茶の金／臙脂の不正解／朱色の判子
   ・書体：見出しと大きな数字＝しっぽり明朝B1（20px以上だけ）／本文＝Zen Kaku Gothic New
   ・角丸は 8 / 12 / 16、線は1pxの細線、光る効果と点滅は使わない
   ═════════════════════════════════════════════════════════════ */
body.hq{
  --bg:#0B100D; --surface:#121A15; --surface2:#162019; --sunk:#1B261E; --ink:#F2EEE2; --muted:#A4AC9A; --faint:#838E7F;
  --line:#253229; --line2:#34463A;
  --pine:#68BE8D; --pine-ink:#07120B; --pine-soft:rgba(104,190,141,.13);
  --brass:#D4AA4F; --brass-ink:#1A1306; --brass-soft:rgba(212,170,79,.12); --brass-line:rgba(212,170,79,.45);
  --miss:#E07662; --miss-soft:rgba(224,118,98,.12); --shu:#D9532C; --amber:#D4AA4F;
  --gold-grad:linear-gradient(180deg,#F4E3AE 0%,#D4AA4F 52%,#B48A35 100%);
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --hud:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --seigaiha:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20' viewBox='0 0 40 20'><circle cx='20' cy='0' r='20' fill='%23121A15' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='0' r='15' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='0' r='10' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='0' r='5' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='0' cy='10' r='20' fill='%23121A15' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='0' cy='10' r='15' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='0' cy='10' r='10' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='0' cy='10' r='5' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='40' cy='10' r='20' fill='%23121A15' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='40' cy='10' r='15' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='40' cy='10' r='10' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='40' cy='10' r='5' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='20' r='20' fill='%23121A15' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='20' r='15' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='20' r='10' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/><circle cx='20' cy='20' r='5' fill='none' stroke='%23D4AA4F' stroke-opacity='.13' stroke-width='.8'/></svg>");
  background:radial-gradient(ellipse 120% 45% at 50% -8%,rgba(212,170,79,.08),transparent 60%),#0B100D;
  background-attachment:fixed;
  font-feature-settings:"palt" 0;
}
body.hq .num{font-variant-numeric:tabular-nums}
body.hq .disp{font-family:var(--display);font-weight:800;letter-spacing:.04em}
body.hq .disp.sm{font-family:var(--display);font-weight:800;letter-spacing:.04em}
body.hq .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:700}
/* 四隅のカギ括弧・方眼・走査線・点滅はやめる */
body.hq .hud::before,body.hq .hud::after,body.hq .hero::after{display:none}
/* ── 上部の帯 ── */
.hqbar{font-family:var(--body);font-size:12px;letter-spacing:.04em;gap:8px}
.hqbar .led{width:6px;height:6px;box-shadow:none;animation:none;background:var(--pine)}
.hqbar .led.off{background:var(--brass);box-shadow:none}
.hqtitle{font-family:var(--display)!important;font-weight:800!important;font-size:19px!important;letter-spacing:.14em!important}
.hqtitle .hqsub{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
body.hq .chipbtn{background:transparent;border-color:var(--line);color:var(--muted)}
/* ── 見出し ── */
.sectitle{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;color:var(--ink);gap:12px;margin-top:6px}
.sectitle::before{content:"";width:6px;height:6px;background:var(--brass);transform:rotate(45deg);flex:none}
.sectitle::after{background:linear-gradient(90deg,var(--line2),transparent)}
.pagebar{padding-block:6px 2px}
.pagebar h1{font-family:var(--display)!important;font-weight:800!important;font-size:28px!important;letter-spacing:.1em!important}
.pagebar .en{font-family:var(--body);font-size:12px;letter-spacing:.24em;color:var(--brass);margin-bottom:0}
/* ── 面（カード）の共通ルール ── */
body.hq .panel,body.hq .ro,body.hq .mode,body.hq .ops,body.hq .orders,body.hq .stat,body.hq .medal,body.hq .cat,body.hq .front,body.hq .intel .card,body.hq .zc,body.hq .qcard,body.hq .subbtn,body.hq .review details{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:none}
body.hq .panel h3{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em}
/* ── ランク（帯） ── */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 16px 16px;gap:14px}
.hero::before{content:"";position:absolute;right:-30px;bottom:-30px;width:220px;height:150px;background:var(--seigaiha);opacity:.9;
  -webkit-mask:radial-gradient(ellipse at 100% 100%,#000 30%,transparent 70%);mask:radial-gradient(ellipse at 100% 100%,#000 30%,transparent 70%);pointer-events:none}
.hero>*{position:relative}
.radar{width:112px;height:112px;background:radial-gradient(circle,rgba(212,170,79,.07),transparent 68%)}
.radar::before{background:repeating-radial-gradient(circle,rgba(212,170,79,.09) 0 1px,transparent 1.5px 10px)}
.radar .ins{filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
.hero .lbl{font-family:var(--body);font-size:12px;letter-spacing:.16em;color:var(--brass);font-weight:700}
.hero .rk{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.1;letter-spacing:.06em;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);filter:none}
.hero .quote{font-size:13px;color:var(--muted);margin-top:6px}
.ammo{gap:3px;margin-top:4px}
.ammo i{height:6px;border-radius:3px;background:var(--sunk);border:0}
.ammo i.on{background:var(--brass);border:0;box-shadow:none}
.ammo i.next{background:transparent;box-shadow:inset 0 0 0 1px var(--brass);animation:none}
.xprow{font-family:var(--body);font-size:13px;letter-spacing:.02em;margin-top:8px}
.xprow b{font-family:var(--display);font-weight:800;font-size:15px;color:var(--brass)}
/* ── 老師のひと言 ── */
.kyokan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);grid-template-columns:116px 1fr;gap:4px;padding:10px 14px 0 0}
.kyokan img{width:128px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.bubble{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-m);padding:10px 13px 11px;font-size:15px;font-weight:500;line-height:1.7}
.bubble .who{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--brass)}
.ikari .bubble{background:#211512;border-color:rgba(224,118,98,.55);font-weight:700}
.ikari .bubble .who{color:var(--miss)}
.dere .bubble{background:#211A12;border-color:var(--brass-line)}
.dere .bubble .who{color:var(--brass)}
.shinpai .bubble{border-color:#3B4A5A}
.shinpai .bubble .who{color:#9DB4C8}
.promo .pline{color:var(--ink)}
/* ── 数字の箱 ── */
.readouts{gap:8px}
.ro{padding:11px 12px 10px}
.ro .k{font-size:12px;letter-spacing:.08em}
.ro .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:.02em}
.ro .v small{font-family:var(--body);font-size:12px;font-weight:700}
/* ── 試験の切り替え ── */
body.hq .seg{gap:6px}
body.hq .seg button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px}
body.hq .seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass);border-color:var(--brass-line)}
/* ── 合格への道のり ── */
.ops{padding:16px 14px}
.dday .k{font-size:12px;letter-spacing:.1em}
.dday .v{font-family:var(--display);font-weight:800;font-size:40px;color:var(--brass);text-shadow:none;letter-spacing:.02em}
.dday button{color:var(--faint)}
.verdict{font-size:13px;font-weight:700;border:1px solid}
.verdict.pass{background:var(--pine-soft);color:var(--pine);border-color:rgba(104,190,141,.4)}
.verdict.not{background:var(--brass-soft);color:var(--brass);border-color:var(--brass-line)}
/* ── 稽古（主役のボタン） ── */
.sortie{border:1px solid var(--brass-line);border-radius:var(--r-l);padding:22px 20px;background:var(--surface);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px rgba(212,170,79,.18)}
.sortie::before{content:"";position:absolute;inset:0;left:auto;width:62%;height:auto;background:var(--seigaiha);opacity:1;top:0;
  -webkit-mask:linear-gradient(90deg,transparent,#000 70%);mask:linear-gradient(90deg,transparent,#000 70%)}
.sortie::after{display:none}
.sortie>*{position:relative}
.sortie .en{font-family:var(--body);font-size:12px;letter-spacing:.32em;color:var(--brass)}
.sortie .big{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.14em;line-height:1.1;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.sortie .sm{font-size:13px;color:var(--muted);margin-top:2px}
.sortie .chev{gap:0}
.sortie .chev i{display:none}
.sortie .chev::after{content:"";width:44px;height:44px;border-radius:50%;border:1px solid var(--brass-line);background:var(--brass-soft) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D4AA4F' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12h13M13 6l6 6-6 6'/></svg>") center/20px no-repeat}
.sortie.go{animation:none}
.subbtn{padding:13px 14px;gap:12px}
.subbtn .cnt{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:12px;line-height:18px;vertical-align:2px;background:var(--miss-soft);color:var(--miss);border:1px solid rgba(224,118,98,.4);font-family:var(--body)}
.subbtn>span:last-child{min-width:0}
.subbtn .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--brass-line);color:var(--brass);flex:none}
.subbtn b{font-size:15px}
/* ── 今日の課題 ── */
.orders{padding:14px 16px 10px}
.orders .oh{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:12px}
.orders .oh b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em}
body.hq .mission{border-top:1px solid var(--line);padding-block:10px}
body.hq .mission:first-of-type{border-top:0}
body.hq .mission .chk{width:20px;height:20px;border-radius:4px;border:1px solid var(--line2)}
body.hq .mission .mbar{height:3px;background:var(--sunk)}
body.hq .mission .mbar i{background:var(--brass)}
.hanko{width:30px;height:30px;border-radius:5px;border:2px solid var(--shu);color:var(--shu);font-family:var(--display);font-weight:800;font-size:15px;transform:rotate(-8deg);background:rgba(217,83,44,.08)}
/* ── 稽古の種類 ── */
body.hq .modes{gap:8px}
body.hq .mode{padding:14px 14px 13px;gap:7px;min-height:122px}
body.hq .mode:hover{border-color:var(--brass-line)}
body.hq .mode b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em}
body.hq .mode span{font-size:12px;line-height:1.55}
body.hq .mode .ic{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--brass-line);color:var(--brass)}
.intel .card .in b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em}
.intel .mo2{font-family:var(--display);font-weight:800;color:var(--brass)}
/* ── 下のタブ ── */
body.hq .tabbar{background:#0D1310;backdrop-filter:none;border-top:1px solid var(--line)}
body.hq .tabbar button{color:var(--faint);font-weight:700;letter-spacing:.04em}
body.hq .tabbar button[aria-current="page"]{color:var(--brass)}
.tabbar .fab{width:64px;height:64px;top:-16px;background:var(--gold-grad);color:var(--brass-ink);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.12em;
  box-shadow:0 0 0 4px #0D1310,0 0 0 5px var(--brass-line),0 8px 18px -6px rgba(0,0,0,.8)}
/* ── 問題の画面 ── */
body.hq .xbtn{background:transparent;border-color:var(--line)}
body.hq .pips i{height:4px;border-radius:2px}
body.hq .pips i.ok{background:var(--pine)} body.hq .pips i.ng{background:var(--miss)} body.hq .pips i.cur{background:var(--brass)}
.combo{font-family:var(--display);font-weight:800;font-size:17px}
body.hq .qcard{padding:18px 18px 20px}
body.hq .qcat{background:transparent;border:1px solid rgba(104,190,141,.45);color:var(--pine);letter-spacing:.06em}
.hotbadge{background:transparent;border:1px solid var(--brass-line);color:var(--brass);font-weight:700}
body.hq .qtext{font-size:17px;line-height:1.85;font-weight:500;margin-top:12px}
body.hq .tf{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-l);font-family:var(--display);font-weight:800;font-size:48px;height:100px}
body.hq .choice{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-m);padding:13px 14px;font-size:16px}
body.hq .choice .k{background:transparent;border:1px solid var(--line2);border-radius:6px;font-family:var(--display);font-weight:800;color:var(--brass)}
body.hq .is-ok{border-color:var(--pine)!important;background:var(--pine-soft)!important}
body.hq .is-ng{border-color:var(--miss)!important;background:var(--miss-soft)!important}
body.hq .idkbtn{border:1px dashed var(--line2);color:var(--muted);font-weight:700;border-radius:var(--r-m)}
body.hq .feedback{border:1px solid var(--line2);border-left-width:3px;border-radius:var(--r-m);background:var(--surface)}
body.hq .feedback.ok{border-color:rgba(104,190,141,.45);border-left-color:var(--pine);background:linear-gradient(90deg,var(--pine-soft),transparent 70%),var(--surface)}
body.hq .feedback.ng{border-color:rgba(224,118,98,.45);border-left-color:var(--miss);background:linear-gradient(90deg,var(--miss-soft),transparent 70%),var(--surface)}
body.hq .feedback.idk{border-color:var(--brass-line);border-left-color:var(--brass);background:linear-gradient(90deg,var(--brass-soft),transparent 70%),var(--surface)}
body.hq .feedback .fh{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em}
body.hq .feedback p{font-size:15px;line-height:1.8}
body.hq .nextbtn{background:var(--gold-grad);color:var(--brass-ink);border-radius:var(--r-m);font-weight:900;letter-spacing:.08em}
.xpfloat{font-family:var(--display);font-weight:800;color:var(--brass);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.clock{font-family:var(--display);font-weight:800}
body.hq .timer{height:4px}
/* ── 結果 ── */
.result h2.disp{font-size:32px!important;letter-spacing:.1em}
.score{font-family:var(--display);font-weight:800;font-size:68px;letter-spacing:.02em}
.score small{font-family:var(--display);font-size:24px}
body.hq .ledger{background:var(--surface)}
.ledger div{border-bottom:1px solid var(--line)}
.ledger div b{font-family:var(--display);font-weight:800;color:var(--brass)}
.jackpot{font-family:var(--display);font-weight:800;background:transparent;color:var(--shu);border:2px solid var(--shu);border-radius:5px;letter-spacing:.2em;transform:rotate(-4deg)}
/* ── ボタン ── */
body.hq .btn{background:transparent;border:1px solid var(--line2);border-radius:var(--r-m);font-weight:700;letter-spacing:.04em}
body.hq .btn.primary{background:var(--gold-grad);color:var(--brass-ink);border-color:transparent;font-weight:900}
body.hq .linkbtn{color:var(--brass)}
/* ── 修行録・図鑑など ── */
body.hq .stat .v,body.hq .pct,body.hq .front .p{font-family:var(--display);font-weight:800}
body.hq .lrow{border-bottom:1px solid var(--line)}
body.hq .lrow.cur{background:var(--brass-soft);box-shadow:inset 2px 0 0 var(--brass)}
body.hq .lrow b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em}
body.hq .front .occ{background:var(--pine-soft)}
body.hq .front.won{border-color:rgba(104,190,141,.5)}
body.hq .filter button{background:transparent;border-color:var(--line);color:var(--muted)}
body.hq .filter button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass);border-color:var(--brass-line)}
body.hq .zc .zn{font-weight:700;letter-spacing:.02em}
body.hq .zc .zs{display:flex;justify-content:space-between;align-items:center;gap:4px;letter-spacing:.06em}
body.hq .zc .zs .lv{font-size:11.5px;color:var(--faint);letter-spacing:0;white-space:nowrap}
body.hq .front .hot{background:transparent;border:1px solid var(--brass-line);color:var(--brass);font-weight:700}
body.hq .medal b{font-family:var(--display);font-weight:800;font-size:14px}
body.hq .week .bar{background:var(--pine);opacity:.85}
body.hq .week .bar.today{background:var(--brass);opacity:1}

body.hq .sheet{background:#101814;border-top:1px solid var(--line2);border-radius:20px 20px 0 0}
body.hq .toast{background:#1A241D;color:var(--ink);border:1px solid var(--brass-line);border-radius:var(--r-m);box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.promo{background:radial-gradient(circle at 50% 38%,#1F2A1F,#0B100D 72%)}

.promo .pname{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.1em;color:var(--ink)}
.promo button{background:var(--gold-grad);color:var(--brass-ink);letter-spacing:.1em}
body.hq textarea,body.hq input[type=text],body.hq select,body.hq input[type=number]{background:#0E1511;border-color:var(--line2);border-radius:var(--r-s)}

.examchip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.02em}
.examchip .led{margin:0}
.examchip svg{color:var(--brass)}

.scrollbody::before{top:-6px} .scrollbody::after{bottom:-6px}
.scrollbody h3{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;margin:4px 0 10px;color:#2A2418}
.scrollbody p{font-family:var(--display);font-weight:600;font-size:16px;line-height:2;margin:0}
.scrollbody ul{margin:14px 0 0;padding-left:1.2em;font-size:15px;line-height:1.85}
.scrollbody li::marker{color:#B5452A}
.scrollbody .seal{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border:2px solid #C8452A;color:#C8452A;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;transform:rotate(-6deg);background:rgba(200,69,42,.06)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{display:flex;flex-direction:column;align-items:stretch;gap:0;text-align:center;border-radius:6px;overflow:hidden;min-height:84px}
.sc .rod{height:7px;background:linear-gradient(180deg,#9A6A3A,#5E3C1E)}
.sc b{flex:1;display:grid;place-items:center;padding:8px 6px;font-family:var(--display);font-weight:800;font-size:13.5px;line-height:1.4;letter-spacing:.02em}
.sc.on{background:#EFE6CF;color:#2A2418}
.sc.off{background:var(--sunk);color:var(--faint);opacity:.85}
.sc.off .rod{background:#2E382F}
.sc.off b{font-family:var(--body);font-weight:700;font-size:12px}
.sizeseg button{flex:1;justify-content:center;text-align:center}
.examlist{display:flex;flex-direction:column;gap:8px}
.examlist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:13px 15px;border-radius:var(--r-m);border:1px solid var(--line2);background:var(--surface2)}
.examlist button b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.05em}
.examlist button span{font-size:12px;color:var(--muted)}
.examlist button[aria-pressed="true"]{border-color:var(--brass-line);background:var(--brass-soft)}
.examlist button[aria-pressed="true"] b{color:var(--brass)}
#app>.stack>*{animation:rise .28s ease-out both}
#app>.stack>*:nth-child(2){animation-delay:.03s}#app>.stack>*:nth-child(3){animation-delay:.06s}#app>.stack>*:nth-child(4){animation-delay:.09s}#app>.stack>*:nth-child(n+5){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
// 問題データ（オリジナル作成。数値・制度は作成時点の一般的な内容。受検前に最新の受検案内・法令で確認すること）
// ex: g3/g2/g1 = 造園技能士 3級/2級/1級、s2/s1 = 造園施工管理技士 2級/1級
// t: "tf" = ○×（a: true/false）、"mc" = 4択（a: 正解の番号 0〜3）
const G = ["g3","g2","g1"], G21 = ["g2","g1"], S = ["s2","s1"], ALL = ["g3","g2","g1","s2","s1"], GS = ["g2","g1","s2","s1"];

window.QUESTIONS = [
// ───────── 造園一般（歴史・様式）
{cat:"造園史・様式",ex:ALL,t:"tf",q:"龍安寺の石庭は、水を使わずに石と砂で山水を表現する枯山水の代表例である。",a:true,e:"龍安寺方丈庭園は白砂と15個の石で構成された枯山水の代表。"},
{cat:"造園史・様式",ex:ALL,t:"tf",q:"日本三名園とは、兼六園・後楽園・栗林公園の3つをいう。",a:false,e:"日本三名園は兼六園（金沢）・後楽園（岡山）・偕楽園（水戸）。栗林公園は含まれない。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"茶庭は露地とも呼ばれ、茶室へ向かう通路としての機能をもつ。",a:true,e:"露地は茶室への導入路。蹲踞・飛石・石灯籠などで構成される。"},
{cat:"造園史・様式",ex:GS,t:"mc",q:"平安時代に書かれた、日本最古の作庭書とされるものはどれか。",c:["作庭記","築山庭造伝","都林泉名勝図会","嵯峨流庭古法秘伝之書"],a:0,e:"『作庭記』は平安時代の作庭書で、橘俊綱の著とされる。"},
{cat:"造園史・様式",ex:GS,t:"mc",q:"西芳寺（苔寺）や天龍寺の庭園の作庭に関わったとされる禅僧は誰か。",c:["小堀遠州","夢窓疎石","千利休","雪舟"],a:1,e:"夢窓疎石は鎌倉末〜南北朝期の禅僧で、西芳寺・天龍寺の庭で知られる。"},
{cat:"造園史・様式",ex:GS,t:"mc",q:"平等院や毛越寺に見られる、極楽浄土を表現した庭園様式はどれか。",c:["枯山水","浄土式庭園","回遊式庭園","露地"],a:1,e:"浄土式庭園は阿弥陀堂の前に池を配し、極楽浄土を表す。"},
{cat:"造園史・様式",ex:GS,t:"mc",q:"ヴェルサイユ宮殿の庭園に代表される西洋庭園の様式はどれか。",c:["イタリア露壇式","フランス平面幾何学式","イギリス風景式","スペイン中庭式"],a:1,e:"ル・ノートルによるヴェルサイユは平面幾何学式の代表。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"イギリス風景式庭園は、直線的な園路と刈込みによる幾何学的な構成を特徴とする。",a:false,e:"風景式は自然の風景を理想化した不整形な構成。幾何学的なのはフランス平面幾何学式。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"庭の外にある山などの景色を、庭の背景として取り込む手法を借景という。",a:true,e:"円通寺（比叡山）や修学院離宮が有名。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"桂離宮の庭園は、池の周りを歩きながら景色の変化を楽しむ回遊式庭園である。",a:true,e:"桂離宮は江戸初期の回遊式庭園の代表。"},

// ───────── 植栽・移植
{cat:"植栽・移植",ex:ALL,t:"tf",q:"常緑広葉樹の移植適期は、一般に新芽が伸び始める前の春や梅雨の時期である。",a:true,e:"常緑広葉樹は寒さに弱いため、厳寒期を避けて春（3月下旬〜4月）や梅雨期に移植する。"},
{cat:"植栽・移植",ex:ALL,t:"tf",q:"落葉樹の移植は、葉が茂っている真夏に行うのが最も適している。",a:false,e:"落葉樹は落葉期（晩秋〜早春、厳寒期を除く）が適期。真夏は蒸散が大きく不適。"},
{cat:"植栽・移植",ex:ALL,t:"tf",q:"根回しは、移植後の活着をよくするため、移植の半年から1年程度前に行う。",a:true,e:"根回しで細根の発生を促す。大木では2〜3年かけて行うこともある。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"根鉢の直径は、一般に根元直径の3〜5倍程度を目安とする。",a:true,e:"一般に根元直径の4倍程度が標準的な目安。"},
{cat:"植栽・移植",ex:GS,t:"mc",q:"根回しの方法として、太根の一部を切らずに残し、その樹皮を環状にはぎ取る目的として正しいものはどれか。",c:["樹木を支えつつ、はいだ部分から発根させるため","根の病気を防ぐため","根鉢を軽くするため","樹液を早く流すため"],a:0,e:"支持根として太根を数本残し、環状剥皮で発根を促す（溝掘り式根回し）。"},
{cat:"植栽・移植",ex:ALL,t:"tf",q:"マツ類の植付けでは、水を注いで土を締める水極めより、土を突き固める土極めが適している。",a:true,e:"マツ類やジンチョウゲなど過湿を嫌う樹種は土極めが向く。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"移植時の幹巻きは、幹からの水分の蒸散や日焼けを防ぐ目的で行う。",a:true,e:"わらや緑化テープを巻いて乾燥・日焼け・寒害から幹を守る。"},
{cat:"植栽・移植",ex:GS,t:"mc",q:"移植時の蒸散抑制として適切でないものはどれか。",c:["枝葉を適度に剪定する","幹巻きを行う","植付け後に十分な水を与える","根鉢を大きく削って根を減らす"],a:3,e:"根を必要以上に減らすと吸水力が落ちて逆効果。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"植え穴は根鉢よりもひと回り大きく掘り、底の土を耕しておく。",a:true,e:"根が伸びやすいよう、植え穴は根鉢より大きめに掘り底をほぐす。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"植付けは、元の生育地より深く植えるほど活着がよくなる。",a:false,e:"深植えは根腐れや生育不良の原因。元と同じ程度の深さに植える。"},
{cat:"植栽・移植",ex:GS,t:"mc",q:"支柱の形式のうち、主に大きな高木に用い、3〜4本の丸太で幹を支えるものはどれか。",c:["添え柱支柱","八つ掛支柱","布掛支柱","鳥居型支柱（二脚）"],a:1,e:"八つ掛支柱は丸太を3〜4方向から斜めに掛けて支える。"},
{cat:"植栽・移植",ex:G,t:"tf",q:"支柱を幹に結束するときは、幹を傷つけないよう杉皮などを当ててからシュロ縄で結ぶ。",a:true,e:"幹当て（杉皮・緑化テープ）をしてからシュロ縄で結束する。"},
{cat:"植栽・移植",ex:G21,t:"tf",q:"布掛支柱は、生垣などの列植した樹木を横木でつないで支えるものである。",a:true,e:"列植の樹木に竹や丸太の横木を渡して連結する。"},

// ───────── 剪定・整枝
{cat:"剪定・整枝",ex:ALL,t:"tf",q:"幹の途中から出る細い枝を胴吹き枝といい、一般に忌み枝として取り除く。",a:true,e:"胴吹き枝は樹形を乱すため除去する。"},
{cat:"剪定・整枝",ex:ALL,t:"mc",q:"根元から出る細い若枝を何というか。",c:["徒長枝","ひこばえ","逆さ枝","車枝"],a:1,e:"ひこばえ（やご）は根元から発生する枝。養分を奪うので切る。"},
{cat:"剪定・整枝",ex:ALL,t:"tf",q:"幹の方向に向かって内側へ伸びる枝を逆さ枝という。",a:true,e:"逆さ枝は樹形の内側に向かって伸びる忌み枝。"},
{cat:"剪定・整枝",ex:G,t:"mc",q:"1か所から放射状に何本もの枝が出ている状態を何というか。",c:["平行枝","車枝","からみ枝","立ち枝"],a:1,e:"車枝（輪生枝）は1〜2本を残して整理する。"},
{cat:"剪定・整枝",ex:ALL,t:"tf",q:"マツのみどり摘みは、一般に新芽が伸びる4〜5月頃に行う。",a:true,e:"春に伸びた新芽（みどり）を摘み、枝の伸びを抑えて樹形を整える。"},
{cat:"剪定・整枝",ex:ALL,t:"tf",q:"マツのもみあげ（古葉取り）は、一般に新芽が出る春先に行う。",a:false,e:"もみあげは秋〜冬（11〜12月頃）に古い葉を取り除く作業。"},
{cat:"剪定・整枝",ex:ALL,t:"tf",q:"サツキは花が終わったらすぐに剪定するのがよい。",a:true,e:"夏に翌年の花芽ができるため、花後すぐに剪定する。遅れると花芽を切ってしまう。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"サクラは切り口から腐朽菌が入りやすいため、太い枝の剪定は避けるのが基本である。",a:true,e:"「桜切る馬鹿、梅切らぬ馬鹿」。切る場合は切り口に癒合剤を塗る。"},
{cat:"剪定・整枝",ex:GS,t:"mc",q:"太い枝を切るときに、樹皮が裂けないよう3回に分けて切る方法を何というか。",c:["切り返し剪定","三段切り","透かし剪定","切り詰め剪定"],a:1,e:"下から切り込み→上から切り落とし→付け根で仕上げ切りの三段切り。"},
{cat:"剪定・整枝",ex:G21,t:"tf",q:"枝を付け根から切るときは、ブランチカラー（枝の付け根のふくらみ）を傷つけないように切る。",a:true,e:"ブランチカラーを残すと切り口がふさがりやすい。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"生垣の刈込みは、下部を狭く上部を広くすると下枝が枯れにくい。",a:false,e:"上を狭く下を広く（台形）すると下枝まで日が当たり、枯れ上がりを防げる。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"枝を途中で切り、残った枝の先の芽や枝に伸びを引き継がせる剪定を切り詰め剪定という。",a:true,e:"切り詰め剪定は樹冠を小さくするときに使う。"},
{cat:"剪定・整枝",ex:G21,t:"mc",q:"枝葉を間引いて日当たりと風通しをよくする剪定はどれか。",c:["刈込み","切り詰め剪定","透かし剪定","強剪定"],a:2,e:"透かし剪定は不要な枝を付け根から抜いて密度を下げる。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"徒長枝は、勢いよくまっすぐ長く伸びる枝で、一般に整理の対象となる。",a:true,e:"徒長枝は樹形を乱し、養分を奪うため整理する。"},
{cat:"剪定・整枝",ex:G21,t:"tf",q:"落葉樹の骨格をつくる強い剪定は、一般に落葉期に行う。",a:true,e:"落葉期は枝の形が見やすく、樹木への負担も少ない。"},
{cat:"剪定・整枝",ex:G21,t:"tf",q:"ウメの花芽は、その年に伸びた短い枝につきやすい。",a:true,e:"ウメは短枝に花芽がつく。徒長枝は切り詰めて短枝を出させる。"},

// ───────── 竹垣・結束
{cat:"竹垣・結束",ex:ALL,t:"tf",q:"四つ目垣は、向こう側が透けて見える透かし垣の一種である。",a:true,e:"四つ目垣は立子と胴縁を四角い目に組んだ代表的な透かし垣。"},
{cat:"竹垣・結束",ex:ALL,t:"tf",q:"建仁寺垣は、立子をすき間なく並べて押縁で押さえた遮蔽垣である。",a:true,e:"建仁寺垣は代表的な遮蔽垣（目隠し垣）。"},
{cat:"竹垣・結束",ex:ALL,t:"mc",q:"次のうち、透かし垣はどれか。",c:["建仁寺垣","御簾垣","光悦寺垣","大津垣"],a:2,e:"光悦寺垣は割竹で菱目を組み、玉縁をかぶせた透かし垣。他は遮蔽垣。"},
{cat:"竹垣・結束",ex:G,t:"mc",q:"竹垣の結束に一般的に使われる結び方はどれか。",c:["いぼ結び（男結び）","蝶結び","もやい結び","巻き結び"],a:0,e:"シュロ縄のいぼ結び（男結び）が基本。ゆるみにくい。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"竹の切り口は、節の上で切る「節止め」にすると雨水がたまりにくい。",a:true,e:"節のすぐ上で切ると、切り口に水がたまらず腐りにくい。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"竹の伐採は、水を多く吸い上げる春から夏が適期である。",a:false,e:"水分・養分が少なく虫がつきにくい秋〜冬が適期。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"シュロ縄は、使う前に水に浸しておくと締まりがよくなる。",a:true,e:"水に浸したシュロ縄は、乾くと締まって結び目がゆるみにくい。"},
{cat:"竹垣・結束",ex:G21,t:"mc",q:"細い竹を網代状に編んだ竹垣はどれか。",c:["四つ目垣","沼津垣","金閣寺垣","矢来垣"],a:1,e:"沼津垣は箱根竹などの細い竹を割らずに網代に編んだ垣。"},
{cat:"竹垣・結束",ex:G21,t:"tf",q:"金閣寺垣は、背の低い足元垣として使われる透かし垣である。",a:true,e:"金閣寺垣は高さの低い透かし垣で、上部に玉縁を付ける。"},
{cat:"竹垣・結束",ex:G21,t:"mc",q:"竹垣で、親柱の間に水平に渡し、立子を取り付ける竹を何というか。",c:["胴縁","押縁","玉縁","間柱"],a:0,e:"胴縁は水平材。立子を結束して固定する。"},
{cat:"竹垣・結束",ex:G21,t:"tf",q:"竹垣の親柱は、腐りにくいよう土に埋まる部分を焼いたり防腐処理したりする。",a:true,e:"埋め込み部分は焼き丸太・防腐剤処理が一般的。"},

// ───────── 石組・園路
{cat:"石組・園路",ex:ALL,t:"mc",q:"蹲踞（つくばい）を構成する石として誤っているものはどれか。",c:["手水鉢","前石","湯桶石","踏分石"],a:3,e:"蹲踞は手水鉢・前石・手燭石・湯桶石など。踏分石は園路の分岐点に置く石。"},
{cat:"石組・園路",ex:ALL,t:"tf",q:"飛石の天端（上面）は、一般に地面から3〜6cm程度の高さに据える。",a:true,e:"歩きやすく美しい高さとして3〜6cm程度が目安。"},
{cat:"石組・園路",ex:G,t:"mc",q:"飛石を2つずつ、3つずつなどと組み合わせて打つ方法はどれか。",c:["直打ち","二三連打ち","雁打ち","千鳥打ち"],a:1,e:"二連・三連を組み合わせた打ち方を二三連打ちという。"},
{cat:"石組・園路",ex:G,t:"tf",q:"千鳥打ちとは、飛石を左右交互にずらして据える打ち方である。",a:true,e:"千鳥足のように左右交互に配置する。"},
{cat:"石組・園路",ex:G,t:"tf",q:"建物の縁先に置き、履物を脱ぐための石を沓脱石という。",a:true,e:"沓脱石は縁側から庭へ出入りする所に置く大きな石。"},
{cat:"石組・園路",ex:G21,t:"mc",q:"石灯籠の部位を上から順に並べたものとして正しいのはどれか。",c:["宝珠→笠→火袋→中台→竿→基礎","宝珠→火袋→笠→竿→中台→基礎","笠→宝珠→火袋→竿→中台→基礎","宝珠→笠→中台→火袋→竿→基礎"],a:0,e:"上から宝珠・笠・火袋・中台・竿・基礎。"},
{cat:"石組・園路",ex:G21,t:"tf",q:"雪見灯籠は、竿がなく、脚で笠や火袋を支える形の灯籠である。",a:true,e:"雪見灯籠は低く、池の近くに置かれることが多い。"},

{hot:1,cat:"土木・材料",ex:G,t:"tf",q:"実物と同じ大きさで描いた図の尺度を「現寸（原寸）」という。",a:true,e:"縮めて描くのが縮尺、大きく描くのが倍尺。"},

{hot:1,cat:"法規",ex:ALL,t:"tf",q:"都市公園法で、動物園や植物園は教養施設に分類される。",a:true,e:"教養施設には植物園・動物園・野外劇場なども含まれる。"},
{hot:1,cat:"法規",ex:ALL,t:"tf",q:"身近な住民が利用する街区公園は、都市公園には含まれない。",a:false,e:"街区公園は都市公園の一種（住区基幹公園）。"},
{hot:1,cat:"安全衛生",ex:ALL,t:"tf",q:"キンク（よじれて折れ曲がった状態）したワイヤロープは、まっすぐに直せば玉掛けに使ってよい。",a:false,e:"一度キンクしたワイヤロープは強度が落ちているので使ってはならない。"},
{hot:1,cat:"安全衛生",ex:G,t:"tf",q:"玉掛けでは、つり荷の角にワイヤロープが当たる所に当て物をする。",a:true,e:"角でロープが傷んだり切れたりするのを防ぐ。"},
{hot:1,cat:"安全衛生",ex:ALL,t:"tf",q:"最大積載量1t未満の不整地運搬車の運転（道路上を除く）には、特別教育が必要である。",a:true,e:"1t以上は技能講習が必要。"},
{hot:1,cat:"安全衛生",ex:ALL,t:"tf",q:"高さまたは深さが1.5mをこえる場所で作業するときは、安全に昇り降りするための設備を設ける。",a:true,e:"はしごやタラップなどの昇降設備を設ける。"},
{hot:1,cat:"安全衛生",ex:G,t:"tf",q:"暑い日は、保護帽（ヘルメット）に穴をあけて風通しをよくするとよい。",a:false,e:"穴あけや改造は強度を落とすので禁止。通気孔付きの製品を選ぶ。"},
{hot:1,cat:"安全衛生",ex:G,t:"tf",q:"脚立は、天板の上に乗って作業してもよい。",a:false,e:"天板に乗るとバランスを崩しやすい。天板には乗らない。"},
{hot:1,cat:"安全衛生",ex:ALL,t:"tf",q:"ツールボックスミーティングとは、作業を始める前に、その日の作業と危険を確認し合う短い打合せである。",a:true,e:"作業後の反省会ではない。KY（危険予知）活動とあわせて行う。"},
{hot:1,cat:"安全衛生",ex:G,t:"tf",q:"刈払機で草を刈る前には、草の中の石や空き缶などを取り除いておく。",a:true,e:"刃に当たった異物が飛んで、人やガラスに当たる事故を防ぐ。"},
// ───────── 2026-10-21 追加①：施工管理（工程・品質・土木・測量・機械）
{cat:"施工管理",ex:S,t:"tf",q:"ネットワーク工程表のクリティカルパス上の作業は、トータルフロート（全余裕）が0である。",a:true,e:"余裕のない作業の連なりがクリティカルパス。1日でも遅れると工期全体が遅れる。"},
{cat:"施工管理",ex:S,t:"mc",q:"ネットワーク工程表で、後に続く作業の最早開始時刻に影響を与えない範囲で使える余裕時間はどれか。",c:["トータルフロート","フリーフロート","ディペンデントフロート","クリティカルパス"],a:1,e:"フリーフロート（自由余裕）は使っても後続作業に影響しない。トータルフロートは工期に影響しない範囲の余裕。"},
{cat:"施工管理",ex:S,t:"tf",q:"ネットワーク工程表で点線の矢印で表すダミーは、作業時間をもたない。",a:true,e:"ダミーは作業の前後関係だけを示す。所要時間は0。"},
{cat:"施工管理",ex:S,t:"mc",q:"作業A（3日）の後に、作業B（5日）と作業C（7日）を並行して行い、B・Cの両方が終わってから作業D（2日）を行う。全体の工期は何日か。",c:["10日","12日","15日","17日"],a:1,e:"最も長い経路 A→C→D＝3＋7＋2＝12日が工期。これがクリティカルパス。"},
{cat:"施工管理",ex:S,t:"tf",q:"工程の出来高累計曲線は、一般に工事の初めと終わりが緩やかで、中ごろが急なS字形になる。",a:true,e:"準備期と仕上げ期は進みが遅く、最盛期に出来高が伸びるため「Sカーブ」と呼ばれる。"},
{cat:"施工管理",ex:S,t:"tf",q:"バナナ曲線は、工程の実績が許容範囲内にあるかを判断するために、上方と下方の許容限界曲線で範囲を示したものである。",a:true,e:"実績の曲線がバナナ形の範囲から外れたら、工程を見直す。"},
{cat:"施工管理",ex:S,t:"tf",q:"ガントチャートは、横軸に各作業の達成度（％）をとるため、各作業の所要日数は読み取りにくい。",a:true,e:"進み具合はひと目で分かるが、日数や作業の前後関係は分からない。"},
{cat:"施工管理",ex:S,t:"tf",q:"施工速度を上げていくと単位あたりの原価は下がるが、突貫工事にすると逆に原価は大きく上がる。",a:true,e:"原価が最も安くなる施工速度を経済速度という。"},
{cat:"施工管理",ex:S,t:"mc",q:"品質管理のPDCAサイクルの正しい順序はどれか。",c:["計画→実施→検討→処置","実施→計画→処置→検討","計画→検討→実施→処置","検討→計画→実施→処置"],a:0,e:"Plan（計画）→Do（実施）→Check（検討・確認）→Act（処置・改善）をくり返す。"},
{cat:"施工管理",ex:S,t:"mc",q:"データを区間ごとに分けて柱状に表し、ばらつきの分布や規格値との関係を見る図はどれか。",c:["ヒストグラム","パレート図","散布図","特性要因図"],a:0,e:"ヒストグラムは分布の形・中心・ばらつきを見るのに使う。"},
{cat:"施工管理",ex:S,t:"tf",q:"管理図は、上方管理限界線と下方管理限界線を用いて、工程が安定した状態にあるかを判断する図である。",a:true,e:"点が限界線の外に出たり、並び方にくせがあれば、異常の原因を調べる。"},
{cat:"施工管理",ex:S,t:"tf",q:"x̄−R管理図のx̄はデータの平均値、Rはデータの範囲（最大値−最小値）を表す。",a:true,e:"平均の変化をx̄図、ばらつきの変化をR図で見る。"},
{cat:"施工管理",ex:S,t:"tf",q:"散布図は、2つの特性の間に相関関係があるかを見るのに使う。",a:true,e:"点の並び方で、正の相関・負の相関・相関なしを判断する。"},
{cat:"施工管理",ex:S,t:"tf",q:"品質特性は、工程の早い段階で結果が分かり、すぐに処置がとれるものを選ぶのが望ましい。",a:true,e:"結果が出るまで時間のかかる特性だけでは、手遅れになりやすい。"},
{cat:"施工管理",ex:S,t:"tf",q:"破壊しなければ調べられない試験では、全数検査ではなく抜取検査を行う。",a:true,e:"全部壊すと製品が残らないため、抜き取ったものだけを試験する。"},
{cat:"土木・材料",ex:S,t:"mc",q:"まだ固まらないコンクリートの軟らかさ（コンシステンシー）を調べる試験はどれか。",c:["スランプ試験","圧縮強度試験","平板載荷試験","標準貫入試験"],a:0,e:"スランプコーンに詰めて引き抜き、下がった高さ（スランプ）を測る。"},
{cat:"土木・材料",ex:S,t:"tf",q:"コンクリートの水セメント比は、大きくするほど強度が高くなる。",a:false,e:"水が多いほど（水セメント比が大きいほど）強度や耐久性は下がる。"},
{cat:"土木・材料",ex:S,t:"tf",q:"普通ポルトランドセメントを使ったコンクリートの湿潤養生期間は、日平均気温15℃以上のとき5日以上が標準である。",a:true,e:"気温が低いほど長くとる（10℃以上で7日、5℃以上で9日が目安）。"},
{cat:"土木・材料",ex:S,t:"tf",q:"日平均気温が4℃以下になると予想されるときは、寒中コンクリートとしての対策をとる。",a:true,e:"凍結を防ぐため、保温養生などを行う。25℃を超えると予想されるときは暑中コンクリート。"},
{cat:"土木・材料",ex:S,t:"tf",q:"棒状バイブレーターは、下層のコンクリートに10cm程度差し込み、引き抜くときはゆっくり行う。",a:true,e:"挿入間隔は50cm以下が目安。急に抜くと穴が残る。"},
{cat:"土木・材料",ex:S,t:"tf",q:"鉄筋のかぶりとは、鉄筋の表面からコンクリートの表面までの最短距離のことである。",a:true,e:"かぶりが不足すると、鉄筋がさびやすくなる。"},
{cat:"土木・材料",ex:S,t:"tf",q:"下層のコンクリートが固まった後に上層を打ち重ねると、コールドジョイントができやすい。",a:true,e:"打重ねの時間間隔を守り、一体にする。"},
{cat:"土木・材料",ex:S,t:"tf",q:"土は、最適含水比のときに締め固めると、最も密に（乾燥密度が最大に）なる。",a:true,e:"水が少なすぎても多すぎても、よく締まらない。"},
{cat:"土木・材料",ex:S,t:"tf",q:"盛土は、一般に一層の仕上がり厚さを30cm程度以下にして、敷き均しと締固めをくり返す。",a:true,e:"厚く盛ってから締めると、下の方まで締まらない。"},
{cat:"土木・材料",ex:S,t:"mc",q:"地山の土量100m³を掘削した。土量変化率L＝1.2のとき、ほぐした土量は何m³か。",c:["83m³","100m³","120m³","144m³"],a:2,e:"ほぐした土量＝地山の土量×L＝100×1.2＝120m³。"},
{cat:"土木・材料",ex:S,t:"mc",q:"地山の土量1,000m³を掘削して運ぶ。L＝1.25、ダンプトラック1台にほぐした土5m³を積むとき、延べ何台必要か。",c:["200台","225台","250台","300台"],a:2,e:"ほぐした土量＝1,000×1.25＝1,250m³。1,250÷5＝250台。"},
{cat:"土木・材料",ex:S,t:"tf",q:"張芝工や種子吹付工は、法面保護工のうちの植生工に分類される。",a:true,e:"植物で法面を覆って守るのが植生工。コンクリート枠などは構造物工。"},
{cat:"施工管理",ex:S,t:"mc",q:"既知点Aの標高が10.000m。Aに立てた標尺の読み（後視）が1.500m、点Bの標尺の読み（前視）が0.800mのとき、点Bの標高は何mか。",c:["9.300m","10.700m","11.500m","12.300m"],a:1,e:"Bの標高＝Aの標高＋後視−前視＝10.000＋1.500−0.800＝10.700m。"},
{cat:"施工管理",ex:S,t:"tf",q:"トータルステーションは、角度と距離を同時に測ることができる測量機器である。",a:true,e:"測ったデータを記録・計算でき、測量の主力になっている。"},
{cat:"施工管理",ex:S,t:"mc",q:"縮尺1/500の図面で1cm²の面積は、実際には何m²か。",c:["5m²","25m²","50m²","250m²"],a:1,e:"図上1cm＝実際5m。1cm²＝5m×5m＝25m²。"},
{cat:"土木・材料",ex:S,t:"mc",q:"アスファルト舗装の構成を、上から順に並べたものとして正しいのはどれか。",c:["表層→基層→路盤→路床","基層→表層→路床→路盤","表層→路盤→基層→路床","路盤→表層→基層→路床"],a:0,e:"表層・基層の下に路盤があり、いちばん下が路床（舗装を支える地盤）。"},
{cat:"土木・材料",ex:S,t:"tf",q:"インターロッキングブロック舗装は、敷砂の上にブロックを並べ、目地に砂を詰めてかみ合わせる舗装である。",a:true,e:"ブロック同士のかみ合わせ（インターロッキング）で荷重を分散する。"},
{cat:"土木・材料",ex:S,t:"tf",q:"透水性舗装は、雨水を舗装の下の路盤や地盤にしみ込ませる舗装である。",a:true,e:"水たまりを防ぎ、雨水を地下に戻す効果がある。"},
{cat:"土木・材料",ex:GS,t:"tf",q:"暗渠排水は、地中に穴のあいた管などを埋めて、地下の余分な水を抜く方法である。",a:true,e:"地下水位を下げ、植物の根腐れや地盤のぬかるみを防ぐ。"},
{cat:"土木・材料",ex:S,t:"tf",q:"雨水桝には泥だめを設けて、土砂が排水管に流れ込むのを防ぐ。",a:true,e:"泥だめにたまった土砂は定期的に取り除く。"},
{cat:"土木・材料",ex:S,t:"tf",q:"給水管と排水管が平行して埋設される場合、給水管は排水管の下方に埋設するのが原則である。",a:false,e:"汚水が入り込まないよう、給水管を排水管の上方に置く。"},
{cat:"施工管理",ex:S,t:"tf",q:"施工計画を立てる前には、契約条件の確認と、現場の地形・地質・周辺環境などの事前調査を行う。",a:true,e:"事前調査が不十分だと、計画のやり直しや事故の原因になる。"},
{cat:"施工管理",ex:S,t:"tf",q:"任意仮設は、発注者が構造や方法を指定せず、施工者が自分の判断で計画する仮設である。",a:true,e:"発注者が指定するのは指定仮設。任意仮設は施工者の工夫が生かせる。"},
{cat:"施工管理",ex:S,t:"mc",q:"機械が置かれている地盤より低い所の掘削に、最も適している建設機械はどれか。",c:["バックホウ","ローディングショベル","ブルドーザ","タイヤローラ"],a:0,e:"バックホウはバケットを手前に引いて掘るので、低い所の掘削に向く。"},
{cat:"施工管理",ex:S,t:"tf",q:"振動ローラは、砂や砂利などの砂質土の締固めに効果が高い。",a:true,e:"振動で粒子をかみ合わせる。粘性土にはタンピングローラなどが向く。"},
{cat:"施工管理",ex:S,t:"tf",q:"実行予算は、工事を実際に行うための原価の目標で、原価管理の基準になる。",a:true,e:"実行予算と実際の原価を比べ、差があれば原因を調べて対策する。"},
// ───────── 追加②：施工管理の安全・法規
{cat:"安全衛生",ex:GS,t:"tf",q:"足場の作業床の墜落防止用の手すりは、高さ85cm以上とする。",a:true,e:"あわせて中さん（高さ35〜50cm）などを設ける。"},
{cat:"安全衛生",ex:GS,t:"tf",q:"空気中の酸素濃度が18%未満の状態を、酸素欠乏という。",a:true,e:"マンホールや井戸、古い桝の中などで起こりやすい。入る前に測定し、換気する。"},
{cat:"安全衛生",ex:GS,t:"tf",q:"車両系建設機械の運転者が運転位置を離れるときは、バケットなどを地上に下ろし、原動機を止めてブレーキをかける。",a:true,e:"機械が勝手に動いたり、バケットが落ちたりする事故を防ぐ。"},
{cat:"安全衛生",ex:ALL,t:"tf",q:"移動式クレーンで作業するときは、つり荷の下や旋回範囲に人を立ち入らせない。",a:true,e:"つり荷の落下や、旋回するクレーン本体に挟まれる事故を防ぐ。"},
{cat:"安全衛生",ex:ALL,t:"tf",q:"熱中症を防ぐ目安として、気温・湿度・日射などから求めるWBGT（暑さ指数）が使われる。",a:true,e:"WBGTが高い日は休憩を増やし、水分と塩分をとる。"},
{cat:"安全衛生",ex:S,t:"tf",q:"元請と下請の労働者が同じ場所で働き、その数が常時50人以上になる建設現場では、元請（特定元方事業者）は統括安全衛生責任者を選任する。",a:true,e:"ずい道工事などでは常時30人以上で選任が必要。"},
{cat:"安全衛生",ex:GS,t:"tf",q:"高さ6.75mを超える箇所で墜落制止用器具を使う場合は、原則としてフルハーネス型を使う。",a:true,e:"それ以下の高さでは、地面に届くおそれがあるため胴ベルト型も使える。"},
{cat:"法規",ex:S,t:"tf",q:"建設業者は、請け負った建設工事を施工するとき、下請であっても工事現場に主任技術者を置かなければならない。",a:true,e:"元請で下請に出す金額が大きい場合は、主任技術者に代えて監理技術者を置く。"},
{cat:"法規",ex:S,t:"tf",q:"公共工事では、下請契約を結んだ場合、その金額にかかわらず施工体制台帳を作成する。",a:true,e:"写しを発注者に提出する。民間工事では下請代金が一定額以上の場合に作成する。"},
{cat:"法規",ex:S,t:"tf",q:"労働基準法では、労働時間は原則として1日8時間、1週40時間を超えてはならない。",a:true,e:"これを超えて働かせるには、労使協定（36協定）の届出などが必要。"},
{cat:"法規",ex:S,t:"tf",q:"使用者は、満18歳未満の者を原則として深夜（午後10時〜午前5時）に働かせてはならない。",a:true,e:"年少者には危険・有害な業務の制限もある。"},
{cat:"法規",ex:S,t:"tf",q:"使用者が労働者を解雇しようとするときは、原則として少なくとも30日前に予告しなければならない。",a:true,e:"予告しない場合は、30日分以上の平均賃金（解雇予告手当）を支払う。"},
{cat:"法規",ex:S,t:"tf",q:"賃金は、通貨で、直接労働者に、その全額を、毎月1回以上、一定の期日を定めて支払わなければならない。",a:true,e:"これを賃金支払いの5原則という。"},
{cat:"法規",ex:GS,t:"tf",q:"公園管理者以外の者が都市公園に公園施設を設けるときは、公園管理者の許可を受けなければならない。",a:true,e:"売店などを民間が設ける場合がこれに当たる。"},
{cat:"法規",ex:GS,t:"tf",q:"特別緑地保全地区は、都市公園法にもとづいて指定される。",a:false,e:"特別緑地保全地区は都市緑地法にもとづく。都市の良好な緑地を守る制度。"},
{cat:"法規",ex:S,t:"tf",q:"騒音規制法の特定建設作業を行うときは、作業開始の7日前までに市町村長へ届け出る。",a:true,e:"振動規制法の特定建設作業も同じく7日前まで。"},
{cat:"法規",ex:GS,t:"tf",q:"建設工事で出た廃棄物は、元請業者が排出事業者として処理の責任を負う。",a:true,e:"下請業者ではなく元請業者が責任者になる。"},
{cat:"法規",ex:S,t:"tf",q:"産業廃棄物管理票（マニフェスト）の写しは、5年間保存しなければならない。",a:true,e:"廃棄物が適正に処理されたかを確かめるための伝票。"},
{cat:"法規",ex:S,t:"mc",q:"道路上で工事を行うために道路を一時的に使うときに必要な、道路交通法にもとづく許可を出すのは誰か。",c:["道路管理者","警察署長","市町村長","都道府県知事"],a:1,e:"道路使用許可は警察署長。道路に工作物を設けて続けて使う道路占用許可は道路管理者。"},
{cat:"法規",ex:GS,t:"tf",q:"国立公園や国定公園の特別地域内で木竹を伐採するときは、許可が必要である。",a:true,e:"自然公園法にもとづく。国立公園は環境大臣、国定公園は都道府県知事の許可。"},
// ───────── 2026-10-21 追加③：技能士（竹垣・石組・剪定・樹木・病害虫・土・芝・歴史）
{hot:1,cat:"竹垣・結束",ex:G,t:"tf",q:"光悦寺垣は、その形から臥牛垣とも呼ばれる。",a:true,e:"牛が寝そべったような、低く弧を描く形から臥牛垣という。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"鉄砲垣は、竹を数本ずつ束ねたものを、胴縁の表と裏に交互に取り付けて作る垣である。",a:true,e:"鉄砲を立て並べたような姿からこの名がある。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"御簾垣は、細い竹を縦にすき間なく並べ、横の押縁で押さえた垣である。",a:false,e:"御簾垣は竹を横に並べ、縦の竪縁で押さえる。すだれ（御簾）に似た姿。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"龍安寺垣は、割竹を斜めに菱目に組んだ、背の低い透かし垣である。",a:true,e:"園路の縁などに使う足元垣の代表。"},
{cat:"竹垣・結束",ex:G,t:"tf",q:"晒竹は、竹の油抜きをして、色つやと耐久性をよくした竹である。",a:true,e:"火であぶるなどして油分を抜く。竹垣の材料に使う。"},
{cat:"竹垣・結束",ex:G,t:"mc",q:"竹垣の材料として最も広く使われる竹はどれか。",c:["マダケ","モウソウチク","ホテイチク","オカメザサ"],a:0,e:"マダケは節間が長くまっすぐで、割りやすい。モウソウチクは太く、たけのこ用に多い。"},
{hot:1,cat:"石組・園路",ex:G,t:"tf",q:"雁打ちは、空を飛ぶ雁の列のように、飛石を少しずつずらして打つ打ち方である。",a:true,e:"直打ち・千鳥打ち・二三連打ちとあわせて覚える。"},
{hot:1,cat:"石組・園路",ex:G,t:"tf",q:"飛石の分かれ道に据える、ほかより大きめの石を踏分石という。",a:true,e:"どちらへも踏み出せるよう、大きく安定した石を使う。"},
{cat:"石組・園路",ex:G,t:"tf",q:"縁側から庭へ下りるとき、沓脱石→二番石→三番石の順に踏んで下りる。",a:true,e:"沓脱石から少しずつ低くして、地面へつなぐ。"},
{cat:"石組・園路",ex:G,t:"tf",q:"春日灯籠は、竿（柱）をもつ立ち灯籠の代表的な形である。",a:true,e:"竿のない雪見灯籠や、竿を地中に埋める織部灯籠と区別する。"},
{hot:1,cat:"石組・園路",ex:G,t:"tf",q:"蹲踞の手水鉢の前の、水が落ちる低い部分を「海」という。",a:true,e:"海には小石を敷き、水はけをよくする。"},
{cat:"石組・園路",ex:G,t:"tf",q:"水琴窟は、蹲踞などの地下に甕を伏せて埋め、落ちる水滴の音を響かせるしかけである。",a:true,e:"江戸時代に工夫されたとされる。"},
{cat:"石組・園路",ex:G,t:"tf",q:"石積みのうち、布積みは横の目地が水平に通る積み方である。",a:true,e:"谷積み（落し積み）は石を斜めに積み、横目地が通らない。"},
{cat:"石組・園路",ex:GS,t:"tf",q:"間知石は、石積みに使うため、表面（面）を四角くそろえて加工した石である。",a:true,e:"控え（奥行き）を長くとり、石積みを安定させる。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"アジサイは秋に翌年の花芽をつくるため、剪定は花が終わったらすぐに行う。",a:true,e:"秋や冬に枝先を切ると、翌年の花が咲かない。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"イロハモミジなどのカエデ類の剪定は、樹液の流れが止まっている落葉期に行う。",a:true,e:"春先に切ると、切り口から樹液が流れ出しやすい。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"フジは、夏に伸びすぎたつるを切り詰めると、短い枝に花芽がつきやすくなる。",a:true,e:"花芽は短枝にできる。長いつるを放っておくと花が減る。"},
{cat:"剪定・整枝",ex:G,t:"tf",q:"生垣の刈込みは、一般に年2回、新芽が伸びた後の初夏と、秋に行う。",a:true,e:"樹種や花の時期で調整する。花ものは花後に刈る。"},
{cat:"樹木の性質",ex:G,t:"mc",q:"次のうち、冬に葉を落とす針葉樹はどれか。",c:["カラマツ","イヌマキ","アカマツ","スギ"],a:0,e:"落葉する針葉樹は、カラマツ・メタセコイア・ラクウショウなど。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"日本で植えられているキンモクセイは、ほとんどが雄株で実がならない。",a:true,e:"キンモクセイは雌雄異株。日本には主に雄株が伝わった。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"センリョウは実が葉の上につき、マンリョウは実が葉の下に垂れ下がる。",a:true,e:"どちらも赤い実の縁起木。実のつき方で見分ける。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"ツバキは花びらが1枚ずつ散り、サザンカは花ごと落ちる。",a:false,e:"逆。ツバキは花ごと落ち、サザンカは花びらが散る。"},
{cat:"樹木の性質",ex:G,t:"tf",q:"ウバメガシは、備長炭の材料として知られる常緑樹である。",a:true,e:"潮風にも強く、生垣にも使われる。"},
{cat:"樹木の性質",ex:G,t:"mc",q:"主に夏に花が咲く花木はどれか。",c:["サルスベリ","ロウバイ","キンモクセイ","ジンチョウゲ"],a:0,e:"サルスベリは夏、キンモクセイは秋、ロウバイは冬、ジンチョウゲは早春。"},
{cat:"病害虫",ex:G,t:"tf",q:"イラガの幼虫は、サクラやカキなどの葉を食べ、触れると電気が走ったような強い痛みがある。",a:true,e:"葉の裏に集まっている若い時期に、葉ごと取り除く。"},
{cat:"病害虫",ex:G,t:"tf",q:"ハダニは、高温で乾燥した時期に発生しやすい。",a:true,e:"葉の裏に水をかける（葉水）と発生を抑えられる。"},
{cat:"病害虫",ex:G,t:"tf",q:"幹の穴から木くず（フラス）が出ていたら、カミキリムシの幼虫が中を食べていることが多い。",a:true,e:"穴に薬剤を入れたり、針金で幼虫を刺したりして駆除する。"},
{cat:"病害虫",ex:ALL,t:"tf",q:"農薬を散布するときは、風を背に受けて（風上から風下に向けて）散布し、風の強い日は避ける。",a:true,e:"薬剤を自分や周りの家にかけないため。"},
{cat:"病害虫",ex:ALL,t:"mc",q:"薬剤を1,000倍に薄めて10Lの散布液を作るとき、必要な薬剤の量はどれか。",c:["1mL","10mL","100mL","1,000mL"],a:1,e:"10L＝10,000mL。10,000÷1,000＝10mL。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"赤玉土は、関東ローム層の赤土を粒にしたもので、通気性と保水性にすぐれる。",a:true,e:"鉢植えの基本の用土として広く使われる。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"鹿沼土は酸性で、サツキやツツジ類の用土に適している。",a:true,e:"栃木県鹿沼地方で採れる軽石質の土。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"肥料の三要素のうち、カリウム（カリ）は根の発育を助けるため「根肥」とも呼ばれる。",a:true,e:"窒素は葉肥、リン酸は花肥・実肥、カリは根肥。"},
{cat:"土壌・肥料",ex:G,t:"tf",q:"苦土石灰は、酸性に傾いた土を中和するために使う。",a:true,e:"苦土（マグネシウム）も補える。まきすぎると土がアルカリ性に傾く。"},
{cat:"芝生・地被",ex:G,t:"tf",q:"芝刈りは、一度に刈り取る量を葉の長さの1/3程度までにするのがよい。",a:true,e:"一度に深く刈ると、芝が弱って枯れることがある。"},
{cat:"芝生・地被",ex:G,t:"tf",q:"目土は、芝生の凹凸をならし、新しい芽の伸びを助けるために行う。",a:true,e:"芽が出る春から初夏に、薄くかける。"},
{cat:"芝生・地被",ex:GS,t:"mc",q:"次のうち、日本芝（暖地型芝草）はどれか。",c:["コウライシバ","ベントグラス","ケンタッキーブルーグラス","トールフェスク"],a:0,e:"日本芝はノシバ・コウライシバなど。ほかの3つは寒地型の西洋芝。"},
{cat:"管理作業",ex:G,t:"tf",q:"ソテツは寒さに弱いため、冬にわらを巻いて霜や寒さから守ることがある。",a:true,e:"冬の風物詩にもなっている防寒作業。"},
{cat:"安全衛生",ex:G,t:"tf",q:"チェーンソーを使って立木を伐る業務には、特別教育を受けた者を就かせる。",a:true,e:"伐木等の業務の特別教育。大径木と小径木で教育の区分がある。"},
{cat:"安全衛生",ex:G,t:"tf",q:"スズメバチの巣の近くで作業するときは、黒っぽい服を避け、白っぽい服を着るとよい。",a:true,e:"ハチは黒い色に向かってくる性質がある。巣を見つけたら近づかない。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"平安時代の寝殿造の庭園は、建物の南に白砂の庭を広げ、その先に池を設けた。",a:true,e:"南庭は儀式の場。池には中島や橋を設けた。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"南禅寺金地院の「鶴亀の庭」は、小堀遠州が作庭に関わったとされる。",a:true,e:"小堀遠州は江戸初期の大名・茶人で、多くの庭や茶室に関わった。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"東京の六義園は、柳沢吉保が造った回遊式の大名庭園である。",a:true,e:"和歌の世界を表した庭として知られる。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"兼六園には、二本の脚のうち一本が短い「徽軫灯籠（ことじとうろう）」がある。",a:true,e:"霞ヶ池のほとりにあり、兼六園の象徴になっている。"},
{cat:"造園史・様式",ex:G,t:"tf",q:"水戸の偕楽園は、徳川斉昭が造った、梅の名所として知られる庭園である。",a:true,e:"日本三名園の一つ。領民にも開放した。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"イギリス風景式庭園を代表する造園家に、ランスロット・ブラウン（ケイパビリティ・ブラウン）がいる。",a:true,e:"18世紀に、なだらかな芝地・湖・木立を組み合わせた風景を数多く作った。"},
{cat:"造園史・様式",ex:G21,t:"tf",q:"イタリアのヴィラ・デステは、斜面を段々に造り、噴水を多く用いた露壇式庭園の代表である。",a:true,e:"露壇式（テラス式）はイタリア・ルネサンス期に発達した。"},
{cat:"造園史・様式",ex:GS,t:"tf",q:"日本の公園制度は、明治6年（1873年）の太政官布達から始まった。",a:true,e:"上野・浅草・芝などの名所が、最初の公園に指定された。"},
